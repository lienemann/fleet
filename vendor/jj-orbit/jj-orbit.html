}
async function keepVersion(k) {
  const p = keepVersionPlan(k);
  if (p.blocked.length) { showToast({ error: 'Another version is immutable (on the remote): keep that one instead, or push this one to replace it.' }, true); return; }
  if (!confirm(`Keep this version and drop ${p.drop.length} other${p.drop.length === 1 ? '' : 's'}?\n\n${p.cmds.join('\n')}\n\nEach step can be undone in the op log.`)) return;
  try {
    if (p.kids.length) {
      const r1 = await postAction('run', { op: 'rebase', mode: 's', src: p.kids, place: 'onto', dst: [p.keep.id] });
      if (!r1.ok) { showToast(r1, true); return; }
    }
    const r2 = await postAction('run', { op: 'abandon', src: p.drop });
    if (!r2.ok) { showToast(r2, true); return; }
    await afterRun(r2);
  } catch (e) { showToast({ error: e.message }, true); }
}

/* ---------- pills (⋯ commits, ⧉ merged, idle) do not pile up: the bigger one wins, the rest hide until zoomed in ---------- */

let declutterFrame = 0;
function declutterPills() {
  if (!R || (declutterFrame++ % 3)) return;
  const pills = [];
  const add = (obj, inner, n, side) => {
    const st = obj._fl;
    if (!obj.visible || !st || !st.vis) { if (obj.element.classList.contains('crowd')) obj.element.classList.remove('crowd'); return; }
    if (!obj._w) obj._w = inner.offsetWidth || 60;
    const w = obj._w, x0 = side < 0 ? st.x - 13 - w : st.x + 8;
    pills.push({ el: obj.element, n, x0, x1: x0 + w, y0: st.y - 9, y1: st.y + 9 });
  };
  for (const l of R.elideLabels || []) add(l.obj, l.obj.element.firstChild, l.g.keys.length, -1);
  for (const l of R.idleLabels || []) add(l.obj, l.obj.element.firstChild, l.g.n || 0, l.g.forks ? 1 : -1);
  pills.sort((a, b) => b.n - a.n);
  const placed = [];
  for (const p of pills) {
    const hit = placed.some((q) => p.x0 < q.x1 && q.x0 < p.x1 && p.y0 < q.y1 && q.y0 < p.y1);
    if (!hit) placed.push(p);
    if (p.el.classList.contains('crowd') !== hit) p.el.classList.toggle('crowd', hit);
  }
}

/* ---------- tooltips for lines: what an edge is and what it stands for ---------- */

const edgeProj = new THREE.Vector3();
function edgeScreenPts(a, b, n, arcBulge) {
  const rect = renderer.domElement.getBoundingClientRect(), pts = [];
  const h = arcBulge == null ? Math.max(0.4, (b[1] - a[1]) * 0.55) : (b[1] - a[1]) * 0.25;
  for (let s = 0; s <= n; s++) {
    const t = s / n, u = 1 - t, w0 = u * u * u, w1 = 3 * u * u * t, w2 = 3 * u * t * t, w3 = t * t * t;
    const bx = arcBulge || 0;
    edgeProj.set(
      w0 * a[0] + w1 * (a[0] + bx) + w2 * (b[0] + bx) + w3 * b[0],
      w0 * a[1] + w1 * (a[1] + h) + w2 * (b[1] - h) + w3 * b[1],
      w0 * a[2] + w1 * a[2] + w2 * b[2] + w3 * b[2]).project(camera);
    if (edgeProj.z > 1) return null;
    pts.push([rect.left + (edgeProj.x + 1) / 2 * rect.width, rect.top + (1 - edgeProj.y) / 2 * rect.height]);
  }
  return pts;
}
function distToPolyline(x, y, pts) {
  let best = Infinity;
  for (let i = 1; i < pts.length; i++) {
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i], dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, ((x - x1) * dx + (y - y1) * dy) / L)) : 0;
    best = Math.min(best, Math.hypot(x - x1 - t * dx, y - y1 - t * dy));

}

  if (!R || !R.edges) return null;
  const P = (k) => [R.cur[k * 3], R.cur[k * 3 + 1], R.cur[k * 3 + 2]];
  let best = null, bd = 6;
  for (const e of R.edges) {
    if (R.sc[e.a] < 0.3 || R.sc[e.b] < 0.3) continue;
    const a = P(e.a), b = P(e.b);
    const straight = Math.abs(a[0] - b[0]) + Math.abs(a[2] - b[2]) < 1e-3;
    const pts = edgeScreenPts(a, b, straight ? 1 : 8);
    if (!pts) continue;
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    if (x < Math.min(...xs) - bd || x > Math.max(...xs) + bd || y < Math.min(...ys) - bd || y > Math.max(...ys) + bd) continue;
    const d = distToPolyline(x, y, pts);
    if (d < bd) { bd = d; best = { type: 'edge', e }; }
  }
  for (const g of (state.deco.foldGroups || new Map()).values()) {
    if (state.foldOpen.has(g.key)) continue;
    for (const f of foldArcs(g)) {
      const pts = f.pts.map((p) => { edgeProj.set(...p).project(camera); const r = renderer.domElement.getBoundingClientRect(); return [r.left + (edgeProj.x + 1) / 2 * r.width, r.top + (1 - edgeProj.y) / 2 * r.height]; });

}

/* ---------- moved block, side by side, with GitLab-style context expansion ---------- */

state.moveCtx = {};
function moveSideBySideHtml(res, mv, key) {
  const fromFile = res.files.find((f) => (f.oldPath || f.path) === mv.from.path) || res.files.find((f) => f.path === mv.from.path);
  const toFile = res.files.find((f) => f.path === mv.to.path);
  if (!fromFile || !toFile) return '';
  const A = fromFile.baseLines, B = toFile.headLines;
  const cx = state.moveCtx[key] || (state.moveCtx[key] = { fu: 3, fd: 3, tu: 3, td: 3 });
  const langA = langOf(mv.from.path), langB = langOf(mv.to.path);
  const num = (n) => `<i>${n ?? ''}</i>`;
  const cell = (lines, n, cls, lang) => n == null ? '<span class="sc empty"></span>' : `<span class="sc ${cls}">${num(n)}${hlLine(lines[n - 1] ?? '', lang) || ' '}</span>`;
  const rows = [];
  const pair = (a, b, ca, cb) => rows.push(cell(A, a, ca, langA) + cell(B, b, cb, langB));
  // context above, bottom-aligned
  const fu = Math.min(cx.fu, mv.from.range.start - 1), tu = Math.min(cx.tu, mv.to.range.start - 1);
  const ctl = (side, dir, left) => left > 0 ? `<button class="linkbtn" data-mvctx="${esc(key)}" data-side="${side}" data-dir="${dir}" data-n="10">${dir === 'u' ? '↑' : '↓'} 10</button> <button class="linkbtn" data-mvctx="${esc(key)}" data-side="${side}" data-dir="${dir}" data-n="all">all ${left}</button>` : '';
  rows.push(`<span class="sc mvexp">${ctl('f', 'u', mv.from.range.start - 1 - fu)}</span><span class="sc mvexp">${ctl('t', 'u', mv.to.range.start - 1 - tu)}</span>`);
  for (let i = Math.max(fu, tu); i > 0; i--) pair(i <= fu ? mv.from.range.start - i : null, i <= tu ? mv.to.range.start - i : null, 'ctxl mvout', 'ctxl mvout');
  // the block itself, aligned through its inner changes
  let i = mv.from.range.start, j = mv.to.range.start;
  const changes = [...mv.innerChanges].sort((x, y) => x.base.start - y.base.start);
  for (const c of changes) {
    while (i < c.base.start && j < c.head.start) pair(i++, j++, 'ctxl mvin', 'ctxl mvin');
    const la = c.base.endExclusive - c.base.start, lb = c.head.endExclusive - c.head.start;
    for (let x = 0; x < Math.max(la, lb); x++) pair(x < la ? c.base.start + x : null, x < lb ? c.head.start + x : null, 'del mvin', 'add mvin');
    i = c.base.endExclusive; j = c.head.endExclusive;
  }
  while (i < mv.from.range.endExclusive || j < mv.to.range.endExclusive) pair(i < mv.from.range.endExclusive ? i++ : null, j < mv.to.range.endExclusive ? j++ : null, 'ctxl mvin', 'ctxl mvin');

  for (let x = 0; x < Math.max(fd, td); x++) pair(x < fd ? mv.from.range.endExclusive + x : null, x < td ? mv.to.range.endExclusive + x : null, 'ctxl mvout', 'ctxl mvout');
  rows.push(`<span class="sc mvexp">${ctl('f', 'd', A.length - (mv.from.range.endExclusive - 1) - fd)}</span><span class="sc mvexp">${ctl('t', 'd', B.length - (mv.to.range.endExclusive - 1) - td)}</span>`);
  const head = `<span class="sc mvhead">${pathHtml(mv.from.path)} <small>before</small></span><span class="sc mvhead">${pathHtml(mv.to.path)} <small>after</small></span>`;
  return `<pre class="diff mvsplit"><span class="split">${head}${rows.join('')}</span></pre>`;
}

  const group = new THREE.Group();

function copyText(t) {

function webUrl(remoteUrl, commitId) {

state.blameSel = null;

let traceGroup = null;
async function annotateData(id, path) {
  const key = id + '\u0000' + path;
  let d = blameCache.get(key);
  if (d && d !== 'loading') return d;
  const r = await fetch(`api/annotate?id=${id}&path=${encodeURIComponent(path)}`, { cache: 'no-store' });
  d = await r.json();
  if (!r.ok || d.error) throw new Error(d.error || 'HTTP ' + r.status);
  blameCache.set(key, d);
  return d;
}
async function movesData(id) {
  if (moveCache.get(id) === undefined) analyzeMoves(id, 'api/texts?id=' + id);
  for (let i = 0; i < 600 && moveCache.get(id) === 'loading'; i++) await new Promise((r) => setTimeout(r, 50));
  return moveCache.get(id);
}
async function traceBlock(commitId, path, lo, hi) {
  const m = state.model;
  state.trace = { path, lo, hi, commit: commitId, steps: [], busy: true };
  state.tree = null; state.follow = null;
  renderInfo();
  let cur = { commit: commitId, path, lo, hi };
  try {
    for (let depth = 0; depth < 14; depth++) {
      const ann = await annotateData(cur.commit, cur.path);
      const counts = new Map();
      for (let i = cur.lo; i <= cur.hi && i < ann.lines.length; i++) {
        const c = ann.commits[ann.who[i]];
        if (!counts.has(c)) counts.set(c, []);
        counts.get(c).push(ann.orig[i]);
      }
      if (!counts.size) break;
      const [cid, origs] = [...counts.entries()].sort((a, b) => b[1].length - a[1].length)[0];
      const step = { at: cur.commit, path: cur.path, commit: cid, lo: Math.min(...origs), hi: Math.max(...origs), share: origs.length, total: cur.hi - cur.lo + 1, others: counts.size - 1 };
      state.trace.steps.push(step);
      renderInfo();
      const res = await movesData(cid);
      if (!res || res === 'loading' || res.error || res.skipped) { step.end = res && res.error ? 'no move data: ' + firstLine(res.error) : 'written here'; break; }
      const mv = res.moves.find((x) => x.to.path === cur.path && x.to.range.start <= step.hi && x.to.range.endExclusive > step.lo);
      if (!mv) { step.end = 'written here'; break; }
      const fLo = mv.from.range.start + Math.max(0, step.lo - mv.to.range.start);
      const fHi = Math.min(mv.from.range.endExclusive - 1, mv.from.range.start + (step.hi - mv.to.range.start));
      step.movedFrom = { path: mv.from.path, lo: fLo, hi: fHi, changed: mv.innerChanges.length > 0 || mv.indentationChanged };
      if (!res.base) break;
      cur = { commit: res.base, path: mv.from.path, lo: fLo - 1, hi: fHi - 1 };
    }

  buildTrace();
  renderInfo();
  void m;
}
function clearTrace() {

    case 'duplicate': return a.dst.length ? { op: 'duplicate', place: a.place, src: a.srcs.length ? a.srcs : [a.src], dst: a.dst } : null;
    case 'revert': return a.dst.length ? { op: a.op, place: a.place, src: a.src, dst: a.dst } : null;
    case 'parallelize': return a.to ? { op: 'parallelize', src: a.src, to: a.to } : null;
    case 'resolve': { const contents = resolvedContents(a); return contents ? { op: 'resolve', src: a.src, contents } : null; }
    case 'abandon': return { op: 'abandon', src: a.srcs.length ? a.srcs : [a.src], restore: a.restore, subtree: a.subtreeMode === 'all', retain_bookmarks: a.retainBookmarks };
    case 'squash': {
      if (a.intoMode === 'target' && !a.into) return null;
      if (a.filesMode === 'some' && !paths.length) return null;
      const req = { op: 'squash', src: a.srcs.length > 1 ? a.srcs : a.src, into: a.intoMode === 'target' ? a.into : null, paths, keep_emptied: a.keepEmptied };
      if (a.intoMode === 'new') {
        if (!a.dst.length || (a.srcs.length > 1 && !a.message.trim())) return null;
        Object.assign(req, { into: null, place: a.place, dst: a.dst, message: a.message.trim() || undefined });
      }
      if (a.filesMode === 'lines') { req.selection = selectionRequest(a); if (!req.selection) return null; }
      if (a.msgMode === 'both') {
        const srcC = m.commits[m.byId.get(a.src)];
        const k = a.intoMode === 'target' ? m.keyOfId(a.into) : (m.nodes[m.keyOfId(a.src)] || {}).parents?.[0];
        const dstC = k >= 0 && k !== undefined ? m.nodes[k].rep : null;
        req.message = [dstC && dstC.desc.trim(), srcC && srcC.desc.trim()].filter(Boolean).join('\n\n');
      } else if (a.msgMode === 'custom') req.message = a.message;
      return req;
    }
    case 'split': {
      const where = a.place !== 'here' ? (a.dst.length ? { place: a.place, dst: a.dst } : null) : {};
      if (!where) return null;
      if (a.filesMode === 'lines') { const sel = selectionRequest(a); return sel ? { op: 'split', src: a.src, message: a.message, parallel: a.parallel, selection: sel, ...where } : null; }
      return a.paths.length ? { op: 'split', src: a.src, message: a.message, parallel: a.parallel, paths: a.paths, ...where } : null;
    }
    case 'describe': return { op: 'describe', src: a.src, message: a.message };
    case 'commit': return { op: 'commit', message: a.message };
    case 'metaedit': return (a.author || a.updateAuthor || a.updateAuthorTs) ? { op: 'metaedit', src: a.src, author: a.author || undefined, update_author: a.updateAuthor, update_author_timestamp: a.updateAuthorTs } : null;
    case 'simplify-parents': return { op: 'simplify-parents', src: a.src };
    case 'absorb': return a.absorbMode === 'pick' ? (a.absorbInto.length ? { op: 'absorb', src: a.src, into: a.absorbInto } : null) : { op: 'absorb', src: a.src };
    case 'new': return a.parents.length ? { op: 'new', parents: a.parents, message: a.message || undefined, no_edit: a.noEdit, place: a.place } : null;
    case 'edit': return { op: 'edit', src: a.src };
    case 'converge': return { op: 'converge', change: a.cid.slice(0, 12) };
    case 'restore': {
      if (a.filesMode === 'lines') { const sel = selectionRequest(a); return sel ? { op: 'restore', into: a.into, selection: sel, restore_descendants: a.restoreDesc } : null; }
      return { op: 'restore', into: a.into, from: a.from || undefined, paths: a.paths, restore_descendants: a.restoreDesc };
    }
    case 'bookmark': return a.name.trim() ? { op: 'bookmark-set', name: a.name.trim(), target: a.src, backwards: a.backwards } : null;
    case 'tag': return a.name.trim() ? { op: 'tag-set', name: a.name.trim(), target: a.src, allow_move: a.allowMove } : null;
    case 'workspace': return a.name.trim() ? { op: 'workspace-add', name: a.name.trim(), target: a.src } : null;
    case 'git-push': {
      const options = [];
      if (a.ciSkip) options.push('ci.skip');
      if (a.ciVar.trim()) for (const v of a.ciVar.split(/[\n,]/).map((x) => x.trim()).filter(Boolean)) options.push(`ci.variable=${v}`);
      if (a.mrCreate) {
        options.push('merge_request.create');
        if (a.mrTarget.trim()) options.push('merge_request.target=' + a.mrTarget.trim());
        if (a.mrTitle.trim()) options.push('merge_request.title=' + a.mrTitle.trim());
        if (a.mrMwps) options.push('merge_request.merge_when_pipeline_succeeds');
      }
      for (const o of a.pushOpts.split('\n').map((x) => x.trim()).filter(Boolean)) options.push(o);
      const req = { op: 'git-push', remote: a.remote || undefined, options, allow_empty_description: a.allowEmptyDesc, allow_private: a.allowPrivate, allow_conflicts: a.allowConflicts };
      if (a.pushMode) req.mode = a.pushMode;
      else if (a.change) { req.change = a.change; if (a.named.trim()) req.named = a.named.trim(); }
      else req.name = a.name;
      return req;
    }
    case 'git-fetch': return { op: 'git-fetch', remote: a.allRemotes ? undefined : a.remote || undefined, all: a.allRemotes, tracked: a.tracked, branches: a.branches.split(/[\s,]+/).filter(Boolean) };
    case 'op-restore': return { op: 'op-restore', op_id: a.opId };
    default: return null;
  }
}

async function postAction(stage, req) {
  const r = await fetch('api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...req, stage }) });
  const text = await r.text();
  if (!r.ok) throw new Error(text || 'HTTP ' + r.status);
  return JSON.parse(text);
}

let planTimer = null;
function planAction() {
  clearTimeout(planTimer);
  const a = state.act;
  const req = a && actRequest(a);
  if (!req) { if (a) a.command = ''; paintCommand(); return; }
  planTimer = setTimeout(async () => {
    try { const res = await postAction('plan', req); if (state.act === a) { a.command = res.command; paintCommand(); } }
    catch (e) { if (state.act === a) { a.command = ''; a.error = e.message; renderInfo(); } }
  }, 120);
}
function paintCommand() {
  const el = document.getElementById('act-cmd');
  if (el && state.act) el.innerHTML = state.act.command ? hl(state.act.command) : '<span class="idr">incomplete</span>';
  const ready = state.act && !!actRequest(state.act) && !state.act.error && !state.act.busy;
  for (const b of infoEl.querySelectorAll('[data-act-cmd="run"], [data-act-cmd="check"]')) b.disabled = !ready;
}

function updateAction(rerender = true) {
  const a = state.act;
  if (!a) return;
  a.error = null;
  a.info = null;
  a.conflicts = null;
  if (!state.exact) {
    const sim = simulate(a);
    if (sim && sim.error) a.error = sim.error;
    applySim(sim);
  }
  planAction();
  buildPhantoms();
  if (rerender) renderInfo();
}

function chipFor(id, removable) {
  const m = state.model, c = m.commits[m.byId.get(id)];
  const label = c ? idHtml(c.cid, c.cp, 'pfx', 8) + ' ' + esc(firstLine(c.desc).slice(0, 40)) : esc(id.slice(0, 12));
  return `<span class="chip">${label}${removable ? `<button data-act-unpick="${id}" aria-label="remove">×</button>` : ''}</span>`;
}

function fileChecklist(a) {
  if (!SERVER) return '';
  let f = filesCache.get(a.src);
  if (f === undefined) { fetchJSON('api/files?id=' + a.src, filesCache, a.src); f = 'loading'; }
  if (f === 'loading') return '<p class="hint">Loading files …</p>';
  if (f.error || !f.files) return `<p class="hint">Files unreadable.</p>`;
  if (!f.files.length) return '<p class="hint">The commit changes no files.</p>';
  return '<fieldset class="filepick"><legend>Files</legend>' + f.files.map((x) => `<label><input type="checkbox" data-act-path="${esc(x.path)}" ${a.paths.includes(x.path) ? 'checked' : ''}><span class="fp">${pathHtml(x.path)}</span></label>`).join('') + '</fieldset>';
}

function actHtml() {
  const a = state.act, m = state.model;
  const srcC = a.src ? m.commits[m.byId.get(a.src)] : null;
  let html = a.srcs.length > 1 ? `<h2>${ACT_TITLE[a.op] || a.op}: ${a.srcs.length} commits</h2><div class="chips">${a.srcs.map((id) => chipFor(id, false)).join('')}</div>`
    : `<h2>${ACT_TITLE[a.op] || a.op} ${srcC ? idHtml(srcC.cid, srcC.cp, 'pfx', 8) : ''}</h2>`;
  if (srcC && a.srcs.length <= 1) html += `<p class="by">${hl(firstLine(srcC.desc) || '(no description)')}</p>`;
  const help = (t) => (t ? ` data-help="${esc(t)}"` : '');
  const radio = (field, value, label, tip) => `<label${help(tip)}><input type="radio" name="${field}" value="${value}" data-act-field="${field}" ${a[field] === value ? 'checked' : ''}><span${tip ? ' class="hashelp"' : ''}>${label}</span></label>`;
  const check = (field, label, tip) => `<label${help(tip)}><input type="checkbox" data-act-field="${field}" ${a[field] ? 'checked' : ''}><span${tip ? ' class="hashelp"' : ''}>${label}</span></label>`;
  // Advanced flags live in a collapsed box; its summary lists the ones that are on, so nothing is hidden silently.
  const optsBox = (title, items) => {
    const on = items.filter((it) => a[it[0]]);
    const open = state.optsOpen && state.optsOpen[a.op + ':' + title];
    return `<details class="opts" data-optbox="${esc(a.op + ':' + title)}" ${open ? 'open' : ''}><summary>${title}${on.length ? ` <span class="optact">${on.map((it) => esc(it[3] || it[1])).join(', ')}</span>` : ' <span class="optnone">default</span>'}</summary>`
      + items.map(([f, l, t]) => check(f, l, t)).join('') + '</details>';
  };
  const section = (legend, body, tip) => `<fieldset><legend${help(tip)}>${legend}</legend>${body}</fieldset>`;
  const pick = (ids, hint, removable = true) => `<div class="pickbox">${ids.length ? ids.map((id) => chipFor(id, removable)).join('') + '<br>' : ''}${hint}</div>`;
  const text = (field, placeholder, list) => `<input type="text" data-act-field="${field}" placeholder="${esc(placeholder)}" value="${esc(a[field])}" ${list ? `list="${list}"` : ''}>`;
  const area = (field, label) => `<textarea data-act-field="${field}" aria-label="${esc(label)}">${esc(a[field])}</textarea>`;
  const placeRadios = () => radio('place', 'onto', 'Onto the destination', '-o: the destination becomes the parent.')
    + radio('place', 'after', 'Insert after the destination', '-A: the destination’s children move on top.')
    + radio('place', 'before', 'Insert before the destination', '-B: goes between the destination and its parents.');
  const placeBox = (legend = 'Where to') => section(legend, placeRadios()
    + pick(a.dst, `Click the destination in the graph${a.dst.length ? ', shift-click for more (merge)' : ''}.`));
  const quick = (req, label, cls, confirmText) => `<button class="${cls || ''}" data-act-quick='${esc(JSON.stringify(req))}' ${confirmText ? `data-confirm="${esc(confirmText)}"` : ''}>${label}</button>`;
  const lineCapable = srcC && m.nodes[m.keyOfId(a.lineSrc || a.src)] && m.nodes[m.keyOfId(a.lineSrc || a.src)].parents.length === 1;
  if (a.ignoreImmutable) html += '<div class="immwarn" data-help="--ignore-immutable: Allow rewriting immutable commits">Rewrites an immutable commit. Anything already pushed or shared will diverge.</div>';
  html += '<div class="actform">';
  switch (a.op) {
    case 'rebase':
      html += section('What moves', radio('mode', 'r', 'Only this commit', '-r: its children move onto its parents.')
        + radio('mode', 's', 'With all descendants', '-s')
        + radio('mode', 'b', 'The whole branch', '-b: everything not yet on the destination.'))
        + placeBox() + rebasePictoHtml(a.mode, a.place)
        + optsBox('Options', [
          ['skipEmptied', 'Drop commits that become empty', '--skip-emptied: If true, when rebasing would produce an empty commit, the commit is abandoned. It will not be abandoned if it was already empty before the rebase. Will never skip merge commits with multiple non-empty parents', '--skip-emptied'],
          ['simplifyParents', 'Simplify parents', '--simplify-parents: Simplify parents of rebased commits, like `jj simplify-parents`, while rebasing them. Any parents that are ancestors of other parents will be removed', '--simplify-parents'],
          ['keepDivergent', 'Keep divergent commits', '--keep-divergent: Keep divergent commits while rebasing. Without this flag, divergent commits are abandoned while rebasing if another commit with the same change ID is already present in the destination with identical changes.', '--keep-divergent']]);
      break;
    case 'duplicate': case 'revert':
      html += placeBox() + '<p class="hint">The new commit appears as an outline at the destination.</p>';
      break;
    case 'parallelize':
      html += `<div class="pickbox">${a.to ? chipFor(a.to, false) + '<br>' : ''}Click the last commit of the chain. Everything from here to there becomes siblings.</div>`;
      break;
    case 'abandon':
      html += section('What goes', radio('subtreeMode', 'one', 'Only this commit', 'Its children move onto its parents.')
        + radio('subtreeMode', 'all', 'This commit and all its descendants', 'Abandons X:: (the commit and everything on top of it).'))
        + optsBox('Options', [
          ['retainBookmarks', 'Keep its bookmarks', '--retain-bookmarks: Do not delete bookmarks pointing to the revisions to abandon. Bookmarks will be moved to the parent revisions instead.', '--retain-bookmarks'],
          ['restore', 'Keep the descendants’ files unchanged', '--restore-descendants: the descendants keep their content; without it they lose this commit’s changes.', '--restore-descendants']]);
      break;
    case 'squash':
      html += section('Into', (a.srcs.length > 1 ? '' : radio('intoMode', 'parent', 'The parent'))
        + radio('intoMode', 'target', 'Another commit', 'Click it in the graph.')
        + radio('intoMode', 'new', 'A new commit somewhere else', 'squash -o/-A/-B: creates a new commit at the destination with these changes.')
        + (a.intoMode === 'target' ? pick(a.into ? [a.into] : [], 'Click the destination in the graph.', false) : '')
        + (a.intoMode === 'new' ? placeRadios() + pick(a.dst, 'Click where the new commit goes.') : ''));
      html += section('What', radio('filesMode', 'all', 'All changes') + radio('filesMode', 'some', 'Selected files')
        + (lineCapable ? radio('filesMode', 'lines', 'Selected lines') : ''));
      if (a.filesMode === 'some') html += fileChecklist(a);
      if (a.filesMode === 'lines') html += lineEditorHtml(a);
      if (a.intoMode === 'new') html += section('Description', area('message', 'Description') + (a.srcs.length > 1 ? '<p class="hint">Required when squashing several commits into a new one.</p>' : '<p class="hint">Empty: keeps the source’s description.</p>'));
      else {
        html += section('Description', radio('msgMode', 'dest', 'Keep the destination’s') + radio('msgMode', 'both', 'Combine both') + radio('msgMode', 'custom', 'Custom'));
        if (a.msgMode === 'custom') html += area('message', 'Description');
      }
      html += optsBox('Options', [['keepEmptied', 'Keep the emptied source commit', '--keep-emptied: The source revision will not be abandoned', '--keep-emptied']]);
      break;
    case 'split':
      html += section('What goes into the first part', radio('filesMode', 'some', 'By file') + (lineCapable ? radio('filesMode', 'lines', 'By line') : ''));
      html += a.filesMode === 'lines' ? lineEditorHtml(a) : fileChecklist(a);
      html += section('Where the first part goes', radio('place', 'here', 'Right below the rest', 'Default: a chain, first part then the rest.')
        + radio('place', 'onto', 'Onto another commit', '-o: The revision(s) to rebase the selected changes onto')
        + radio('place', 'after', 'Insert after another commit', '-A')
        + radio('place', 'before', 'Insert before another commit', '-B')
        + (a.place !== 'here' ? pick(a.dst, 'Click the destination in the graph.') : ''));
      html += section('Description of the first part', area('message', 'Description of the first part'));
      html += optsBox('Options', [['parallel', 'Make them siblings instead of a chain', '-p, --parallel: the two parts get the same parents.', '--parallel']]);
      break;
    case 'describe': case 'commit':
      html += area('message', 'Description');
      break;
    case 'metaedit':
      html += text('author', 'Author: Name <email>') + check('updateAuthor', 'Set the author to me (--update-author)') + check('updateAuthorTs', 'Set the author timestamp to now (--update-author-timestamp)');
      break;
    case 'new':
      html += section('Where', radio('place', 'onto', 'On top', 'The commits below become its parents.')
        + radio('place', 'after', 'Insert after', '-A, --insert-after: Insert the new change after the given commit(s); their children move on top of it.')
        + radio('place', 'before', 'Insert before', '-B, --insert-before: Insert the new change before the given commit(s).')
        + pick(a.parents, 'Click more commits in the graph for a merge.', true));
      html += section('Description', text('message', 'Description (optional)'));
      html += optsBox('Options', [['noEdit', 'Keep the working copy where it is', '--no-edit: do not make the new commit the working-copy commit.', '--no-edit']]);
      break;
    case 'restore':
      if (!a.from && lineCapable) html += '<fieldset><legend>Scope</legend>' + radio('filesMode', 'paths', 'Whole file') + radio('filesMode', 'lines', 'Selected lines') + '</fieldset>';
      if (a.filesMode === 'lines') html += lineEditorHtml(a);
      else html += `<p class="hint">${a.from ? 'Take the file from the earlier version.' : 'Discard this commit’s changes to the file.'}</p><p>${a.paths.map((p) => `<span class="chip">${pathHtml(p)}</span>`).join(' ')}</p>`;
      html += check('restoreDesc', 'Keep the descendants’ content (--restore-descendants)');
      break;
    case 'resolve':
      html += resolveHtml(a);
      break;
    case 'absorb':
      html += `<p class="hint">Moves each change of this commit into the mutable ancestor that last modified those lines.</p>`
        + section('Into', radio('absorbMode', 'all', 'Any mutable ancestor', 'Default: mutable()')
          + radio('absorbMode', 'pick', 'Only the commits I pick', '-t, --into: Destination revisions to absorb into')
          + (a.absorbMode === 'pick' ? pick(a.absorbInto, 'Click the allowed destinations in the graph.') : ''))
        + (a.absorbTargets ? (a.absorbTargets.length ? `<p>Changes go into: ${a.absorbTargets.map((id) => chipFor(id, false)).join(' ')}</p>` : '') : '<p class="hint">Asking jj where the changes would go …</p>');
      break;
    case 'simplify-parents': case 'edit': case 'converge':
      html += `<p class="hint">${{ absorb: 'Moves each change of this commit into the mutable ancestor that last modified those lines.', 'simplify-parents': 'Removes parent edges that are reachable through another parent anyway.', edit: 'The working copy switches to this commit.', converge: 'jj tries to merge the versions of this change into one. If it cannot decide on its own (for example different descriptions), it reports why.' }[a.op]}</p>`;
      break;
    case 'bookmark': {
      const names = uniq(m.bookmarks.filter((b) => !b.remote).map((b) => b.name)).sort();
      html += '<fieldset><legend>Set here, or move here</legend>' + text('name', 'Name, new or existing', 'bm-names')
        + `<datalist id="bm-names">${names.map((x) => `<option value="${esc(x)}">`).join('')}</datalist>`
        + check('backwards', 'Allow moving backwards (--allow-backwards)') + '</fieldset>';
      const here = srcC ? srcC.lb : [];
      for (const x of here) {
        const remotes = m.bookmarks.filter((b) => b.remote && b.name === x);
        html += `<fieldset><legend>${esc(x)}</legend><div class="actrow">`
          + `<input type="text" data-rename-of="${esc(x)}" placeholder="new name" size="14">`
          + `<button data-act-rename="${esc(x)}">rename</button>`
          + `<button data-act-push="${esc(x)}">Push …</button>`
          + quick({ op: 'bookmark-delete', name: x }, 'delete', 'warn', `Delete bookmark “${x}”? The next push deletes it on the remote too.`)
          + quick({ op: 'bookmark-forget', name: x }, 'forget', '', `Forget bookmark “${x}” (no deletion on the remote)?`)
          + '</div>';
        for (const r of remotes) html += `<div class="actrow"><span class="chip bm">${esc(x + '@' + r.remote)}</span>${quick({ op: r.tracked ? 'bookmark-untrack' : 'bookmark-track', name: x, remote: r.remote }, r.tracked ? 'untrack' : 'track')}</div>`;
        html += '</fieldset>';
      }
      const remoteHere = srcC ? srcC.rb.filter((r) => !here.includes(r.slice(0, r.lastIndexOf('@')))) : [];
      for (const r of remoteHere) {
        const at = r.lastIndexOf('@'), nm = r.slice(0, at), rem = r.slice(at + 1);
        const b = m.bmState.get(r);
        html += `<div class="actrow"><span class="chip bm">${esc(r)}</span>${quick({ op: b && b.tracked ? 'bookmark-untrack' : 'bookmark-track', name: nm, remote: rem }, b && b.tracked ? 'untrack' : 'track')}</div>`;
      }
      html += `<div class="actrow">${quick({ op: 'bookmark-advance', target: a.src }, 'Advance the closest bookmarks to here')}</div>`;
      break;
    }
    case 'tag': {
      html += '<fieldset><legend>Set</legend>' + text('name', 'Tag name') + check('allowMove', 'Move an existing tag (--allow-move)') + '</fieldset>';
      for (const t of (srcC && srcC.tags) || []) html += `<div class="actrow"><span class="chip bm">${esc(t)}</span>${quick({ op: 'tag-delete', name: t }, 'delete', 'warn', `Delete tag “${t}”?`)}</div>`;
      html += '<fieldset><legend>Track a remote tag</legend><div class="actrow"><input type="text" data-tagref placeholder="name@remote" size="18"><button data-act-tagtrack="track">track</button><button data-act-tagtrack="untrack">untrack</button></div></fieldset>';
      break;
    }
    case 'workspace':
      html += text('name', 'Workspace name') + '<p class="hint">Created next to the current workspace directory.</p>';
      break;
    case 'git-push': {
      const remotes = uniq(m.bookmarks.filter((b) => b.remote).map((b) => b.remote));
      const trunkBm = (() => { const t = m.meta.trunk; const tc = t && m.commits[m.byId.get(t)]; return tc && tc.lb[0] || 'main'; })();
      const what = a.pushMode === 'tracked' ? '<p>All tracked bookmarks and tags <small class="hint">--tracked</small></p>'
        : a.pushMode === 'deleted' ? '<p>All deleted bookmarks and tags <small class="hint">--deleted</small></p>'
        : a.change ? `<p>Change ${chipFor(a.change, false)}</p>` + section('Bookmark name', text('named', 'empty: jj generates one'), '--named NAME=REV, or --change when empty')
        : `<p>Bookmark <span class="chip bm">${esc(a.name)}</span></p>`;
      html += what
        + (remotes.length > 1 ? section('Remote', remotes.map((r) => radio('remote', r, r)).join('')) : '')
        + section('GitLab', check('ciSkip', 'Skip the CI pipeline', '-o ci.skip: Do not create a CI/CD pipeline for the latest push.')
          + check('mrCreate', 'Create a merge request', '-o merge_request.create')
          + (a.mrCreate ? `<div class="optsub">${text('mrTarget', 'target branch, e.g. ' + trunkBm, 'bm-targets')}<datalist id="bm-targets">${uniq(m.bookmarks.filter((b) => !b.remote).map((b) => b.name)).map((x) => `<option value="${esc(x)}">`).join('')}</datalist>${text('mrTitle', 'title (optional)')}${check('mrMwps', 'Merge when the pipeline succeeds', '-o merge_request.merge_when_pipeline_succeeds')}</div>` : ''),
        'Git push options (-o). They only work if the remote supports them; GitLab does.')
        + `<details class="opts" data-optbox="git-push:more" ${state.optsOpen && state.optsOpen['git-push:more'] ? 'open' : ''}><summary>More push options${(a.ciVar.trim() || a.pushOpts.trim()) ? ' <span class="optact">set</span>' : ''}</summary>`
        + `<label class="plain" data-help="-o ci.variable=NAME=value: Provide CI/CD variables to the CI/CD pipeline, if one is created due to the push.">CI variables, NAME=value per line</label><textarea data-act-field="ciVar" rows="1" class="small">${esc(a.ciVar)}</textarea>`
        + `<label class="plain" data-help="Passed as -o, one per line.">Other push options</label><textarea data-act-field="pushOpts" rows="1" class="small">${esc(a.pushOpts)}</textarea></details>`
        + optsBox('Allow', [
          ['allowEmptyDesc', 'Commits without description', '--allow-empty-description: Allow pushing commits with empty descriptions', '--allow-empty-description'],
          ['allowPrivate', 'Private commits', '--allow-private: Allow pushing commits that are private. The set of private commits can be configured by the `git.private-commits` setting. The default is `none()`, meaning all commits are eligible to be pushed.', '--allow-private'],
          ['allowConflicts', 'Commits with conflicts', '--allow-conflicts: Allow pushing commits that contain conflicts', '--allow-conflicts']])
        + '<p class="hint">“Dry run” asks the remote without changing anything.</p>';
      break;
    }
    case 'git-fetch': {
      const remotes = uniq(m.bookmarks.filter((b) => b.remote).map((b) => b.remote));
      html += section('From', (remotes.length > 1 ? remotes.map((r) => radio('remote', r, r)).join('') : '')
        + check('allRemotes', 'All remotes', '--all-remotes: Fetch from all remotes'))
        + section('What', check('tracked', 'Only tracked bookmarks', '--tracked: Fetch only tracked bookmarks and tags. This fetches only bookmarks and tags that are already tracked from the specified remote(s).')
          + `<label class="plain" data-help="-b, --branch: Name of the branch to fetch (can be repeated)">Only these branches (space separated, globs allowed)</label>${text('branches', 'empty: all, e.g. main feat/*')}`);
      break;
    }
    case 'op-restore':
      html += `<p>Restore the repo to the state after operation <code>${esc(a.opId)}</code>.</p><p class="hint">This is a new operation itself and can be undone.</p>`;
      break;
  }
  html += '</div>';
  html += `<h3>Command</h3><div class="cmd"><code id="act-cmd">${a.command ? hl(a.command) : '<span class="idr">incomplete</span>'}</code></div>`;
  if (a.error) html += `<p class="acterr">${esc(a.error)}${a.errorAct != null ? ` <button class="linkbtn" data-output="${a.errorAct}">full output</button>` : ''}</p>`;
  if (a.info) html += `<pre class="diff"><span>${esc(a.info)}</span></pre>`;
  if (state.exact) {
    const n = a.conflicts || [];
    html += `<div class="exact"><b>Exact preview</b> from jj (operation ${esc(state.exact.op)}, not applied). `
      + (n.length ? `New conflicts in ${n.length} commit${n.length === 1 ? '' : 's'}: ${n.map((c) => idHtml(c.cid, c.cp, 'pfx', 8)).join(', ')}` : 'No new conflicts.') + '</div>';
  }
  const ready = !!actRequest(a) && !a.error && !a.busy;
  html += '<div class="actrow" style="margin-top:10px">';
  if (state.exact) html += '<button data-act-cmd="discard">Back to the simulation</button>';
  else if (a.op === 'git-push') html += `<button data-act-cmd="check" ${ready ? '' : 'disabled'}>Dry run</button>`;
  else if (!NO_PREVIEW.has(a.op) && a.op !== 'bookmark' && a.op !== 'tag') html += `<button data-act-cmd="check" ${ready ? '' : 'disabled'}>Check conflicts</button>`;
  html += `<button class="go" data-act-cmd="run" ${ready ? '' : 'disabled'}>Run</button><button data-act-cmd="cancel">Cancel</button></div>`;
  if (a.busy) html += '<p class="hint">Running …</p>';
  return html;
}

async function checkConflicts() {
  const a = state.act, req = actRequest(a);
  if (!req) return;
  clearPhantoms();
  a.busy = true; renderInfo();
  try {
    const before = new Set(state.model.nodes.filter((n) => n.rep.conflict).map((n) => n.rep.cid));
    const res = await postAction('preview', req);
    if (!res.ok) { a.error = res.error; return; }
    if (res.noop || !res.graph) { a.info = res.output || 'Nothing to do.'; return; }
    state.exact = { op: res.graph.meta.preview.op };
    live.hold = true;
    state.sim = null;
    loadText(JSON.stringify(res.graph), false, false);
    a.conflicts = res.graph.commits.filter((c) => !c.gone && c.conflict && !before.has(c.cid));
  } catch (e) {
    a.error = e.message;
  } finally {
    a.busy = false;
    renderInfo();
  }
}
async function discardExact() {
  state.exact = null;
  live.hold = false;
  live.graph = 0;
  await pullGraph();
  if (state.act) updateAction();
}
async function afterRun(res) {
  state.act = null;
  clearPhantoms();
  state.exact = null;
  state.sim = null;
  live.hold = false;
  live.graph = 0;
  await pullGraph();
  renderInfo();
  showToast(res);
}
async function runAction() {
  const a = state.act, req = actRequest(a);
  if (!req) return;
  a.busy = true; renderInfo();
  try {
    const res = await postAction('run', req);
    if (!res.ok) { a.error = res.error; a.errorAct = res.activity; a.busy = false; renderInfo(); return; }
    await afterRun(res);
  } catch (e) {
    a.error = e.message; a.busy = false; renderInfo();
  }
}
async function quickRun(req, confirmText) {
  if (confirmText && !confirm(confirmText)) return;
  try {
    const res = await postAction('run', req);
    if (!res.ok) { if (state.act) { state.act.error = res.error; renderInfo(); } else showToast(res, true); return; }
    await afterRun(res);
  } catch (e) {
    if (state.act) { state.act.error = e.message; renderInfo(); } else showToast({ error: e.message }, true);
  }
}

const toastEl = $('#toast');
let toastTimer = null;
function showToast(res, bad) {
  clearTimeout(toastTimer);
  toastEl.classList.toggle('bad', !!bad);
  toastEl.innerHTML = `<span class="msg" title="${esc(res.output || res.error || '')}">${bad ? esc(firstLine(res.error || 'Failed')) : '✓ ' + hl(firstLine(res.op_desc || res.command || ''))}</span>`
    + (res.activity != null ? `<button data-output="${res.activity}">Output</button>` : '')
    + (res.op && !bad ? `<button data-undo="${esc(res.op)}">Undo</button>` : '') + '<button data-close aria-label="Close">×</button>';
  toastEl.hidden = false;
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 20000);
}
toastEl.addEventListener('click', async (e) => {
  if (e.target.closest('[data-close]')) { toastEl.hidden = true; return; }
  const ob = e.target.closest('[data-output]');
  if (ob) { showActivity(+ob.dataset.output); return; }
  const u = e.target.closest('[data-undo]');
  if (!u) return;
  u.disabled = true;
  try {
    const res = await postAction('run', { op: 'undo', op_id: u.dataset.undo });
    live.graph = 0;
    await pullGraph();
    showToast(res, !res.ok);
  } catch (err) { showToast({ error: err.message }, true); }
});

infoEl.addEventListener('click', (e) => {
  const start = e.target.closest('[data-act-start]');
  if (start && !['sign', 'unsign', 'next', 'prev'].includes(start.dataset.actStart) && state.selected && state.selected.type === 'node') { startAction(start.dataset.actStart, state.selected.k, start.dataset.actExtra ? JSON.parse(start.dataset.actExtra) : undefined); return; }
  const fileAct = e.target.closest('[data-file-act]');
  if (fileAct) {
    e.stopPropagation();
    const kind = fileAct.dataset.fileAct, path = fileAct.dataset.path, id = fileAct.dataset.fid;
    if (kind === 'show') { state.openFile = state.openFile && state.openFile.id === id && state.openFile.path === path ? null : { id, path }; renderInfo(); return; }
    const sel = state.selected;
    const k = sel && sel.type === 'node' ? sel.k : sel && sel.type === 'ghost' ? R.ghosts[sel.i].k : -1;
    if (kind === 'discard') startAction('restore', k, { into: id, from: null, paths: [path] });
    if (kind === 'toparent') startAction('squash', k, { filesMode: 'some', paths: [path], intoMode: 'parent' });
    if (kind === 'tochild') startAction('squash', k, { filesMode: 'some', paths: [path], intoMode: 'target', into: fileAct.dataset.child, msgMode: 'dest' });
    if (kind === 'take') startAction('restore', k, { into: state.model.nodes[k].rep.id, from: id, paths: [path] });
    return;
  }
  if (!state.act) return;
  const cmd = e.target.closest('[data-act-cmd]');
  if (cmd) {
    const c = cmd.dataset.actCmd;
    if (c === 'cancel') { if (state.exact) discardExact().then(cancelAction); else cancelAction(); }
    else if (c === 'check') checkConflicts();
    else if (c === 'discard') discardExact();
    else if (c === 'run') runAction();
    return;
  }
  const un = e.target.closest('[data-act-unpick]');
  if (un) {
    const a = state.act, id = un.dataset.actUnpick;
    a.dst = a.dst.filter((x) => x !== id);
    a.parents = a.parents.filter((x) => x !== id);
    if (a.absorbInto && a.absorbInto.includes(id)) { a.absorbInto = a.absorbInto.filter((x) => x !== id); a.absorbTargets = null; loadAbsorbTargets(a); }
    updateAction();
    return;
  }
  const q = e.target.closest('[data-act-quick]');
  if (q) { quickRun(JSON.parse(q.dataset.actQuick), q.dataset.confirm); return; }
  const rn = e.target.closest('[data-act-rename]');
  if (rn) {
    const old = rn.dataset.actRename, input = infoEl.querySelector(`[data-rename-of="${CSS.escape(old)}"]`);
    const nw = input && input.value.trim();
    if (nw) quickRun({ op: 'bookmark-rename', old, new: nw });
    return;
  }
  const pu = e.target.closest('[data-act-push]');
  if (pu) { const k = state.model.keyOfId(state.act.src); startAction('git-push', k, { name: pu.dataset.actPush, remote: (state.model.bookmarks.find((b) => b.remote && b.name === pu.dataset.actPush) || {}).remote || '' }); return; }
  const tt = e.target.closest('[data-act-tagtrack]');
  if (tt) {
    const ref = (infoEl.querySelector('[data-tagref]') || {}).value || '';
    const at = ref.lastIndexOf('@');
    if (at > 0) quickRun({ op: 'tag-' + tt.dataset.actTagtrack, name: ref.slice(0, at), remote: ref.slice(at + 1) });
  }
});
function actField(e) {
  const a = state.act;
  if (!a) return;
  if (lineEvent(e)) return;
  const pathBox = e.target.closest('[data-act-path]');
  if (pathBox) {
    const p = pathBox.dataset.actPath;
    a.paths = pathBox.checked ? uniq(a.paths.concat(p)) : a.paths.filter((x) => x !== p);
    updateAction(false);
    paintCommand();
    return;
  }
  const el = e.target.closest('[data-act-field]');
  if (!el) return;
  const f = el.dataset.actField;
  if (el.type === 'checkbox') { a[f] = el.checked; saveSticky(a); }
  else a[f] = el.value;
  if (el.tagName === 'TEXTAREA' || el.type === 'text') { planAction(); return; }
  if (f === 'intoMode' && a.intoMode === 'parent') a.into = null;
  if (f === 'absorbMode') { a.absorbTargets = null; loadAbsorbTargets(a); }
  if (f === 'place' || f === 'intoMode') a._fitted = null;
  updateAction();
}
infoEl.addEventListener('change', actField);
infoEl.addEventListener('input', (e) => { const el = e.target.closest('[data-act-field]'); if (el && (el.tagName === 'TEXTAREA' || el.type === 'text')) actField(e); });

/* ---------- live server ---------- */

const live = { auto: true, connected: false, busy: false, pending: false, graph: 0, op: null, ms: 0, error: null, pulling: false };

function renderLive() {
  if (!SERVER) return;
  let color = live.error ? 'var(--warn)' : live.connected ? 'var(--cyan)' : 'var(--ink-dim)';
  let text;
  if (!live.connected) text = 'Server unreachable, reconnecting';
  else if (live.busy) text = 'Reading the repo';
  else if (live.error) text = 'Export failed: ' + esc(firstLine(live.error));
  else text = `Live at op ${esc(live.op || '?')}` + (live.ms ? `, Export ${live.ms} ms` : '');
  if (live.busy) color = 'var(--amber)';
  const st = $('#live-status');
  st.innerHTML = `<span class="ldot" style="background:${color};color:${color}"></span>${text}`;
  st.title = live.error || '';
  $('#live-auto').setAttribute('aria-pressed', live.auto);
  $('#live-apply').hidden = !live.pending;
  $('#live-refresh').disabled = live.busy;
}

async function pullGraph() {
  if (live.pulling) { live.again = true; return; }
  live.pulling = true;
  try {
    const r = await fetch('api/graph', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const g = +(r.headers.get('X-Orbit-Graph') || 0);
    const text = await r.text();
    if (g >= live.graph && loadText(text, false, false)) { live.graph = g; live.pending = false; }
  } catch (e) {
    $('#err').textContent = 'Could not load the state: ' + e.message;
  }
  live.pulling = false;
  renderLive();
  if (live.again) { live.again = false; pullGraph(); }
}

function offerGraph(n) {
  if (n <= live.graph) return;
  if (live.hold) { live.pending = true; return; }
  if (live.auto || !state.model) pullGraph();
  else live.pending = true;
}

const PAGE_VERSION = (document.querySelector('meta[name="jj-orbit-version"]') || {}).content || '';
$('#ver').textContent = PAGE_VERSION ? 'v' + PAGE_VERSION : '';
function connectLive() {
  const es = new EventSource('api/events');
  es.addEventListener('hello', (e) => {
    const d = JSON.parse(e.data);
    // a tab left open across a server update keeps the old page: say so instead of letting old code run
    const vw = $('#verwarn');
    vw.hidden = !d.version || !PAGE_VERSION || d.version === PAGE_VERSION;
    if (!vw.hidden) vw.innerHTML = `This page is v${esc(PAGE_VERSION)}, the server runs v${esc(d.version)}. <button class="linkbtn" onclick="location.reload()">Reload</button>`;
    Object.assign(live, { connected: true, op: d.op, ms: d.ms, busy: d.busy, error: d.error, actions: d.actions !== false });
    offerGraph(d.graph);
    renderLive();
  });
  es.addEventListener('busy', () => { live.busy = true; renderLive(); });
  es.addEventListener('graph', (e) => {
    const d = JSON.parse(e.data);
    Object.assign(live, { busy: false, error: null, op: d.op, ms: d.ms });
    offerGraph(d.graph);
    renderLive();
  });
  es.addEventListener('fail', (e) => { live.busy = false; live.error = JSON.parse(e.data).message; renderLive(); });
  es.onerror = () => { live.connected = false; renderLive(); };
}

$('#live-auto').onclick = () => {
  live.auto = !live.auto;
  try { localStorage.setItem('jj-orbit:auto', live.auto ? '1' : '0'); } catch { /* ignore */ }
  if (live.auto && live.pending) pullGraph();
  renderLive();
};
$('#live-apply').onclick = () => pullGraph();
$('#op-undo').onclick = () => quickRun({ op: 'undo-last' });
$('#op-redo').onclick = () => quickRun({ op: 'redo' });
$('#touchpad').onclick = () => {
  scrollPans = !scrollPans;
  try { localStorage.setItem('jj-orbit:scrollpans', scrollPans ? '1' : '0'); } catch { /* ignore */ }
  renderTouchpadButton();
};
renderTouchpadButton();
$('#meta').addEventListener('click', (e) => { if (e.target.closest('[data-updstale]')) quickRun({ op: 'workspace-update-stale' }); });
$('#live-activity').onclick = () => { const box = $('#activity'); box.hidden = !box.hidden; if (!box.hidden) renderActivity(); };
$('#live-refresh').onclick = async () => {
  if (live.busy) return;
  live.busy = true; renderLive();
  try {
    const r = await fetch('api/refresh?snapshot=1', { method: 'POST' });
    const text = await r.text();
    if (!r.ok) throw new Error(text || 'HTTP ' + r.status);
    const g = +(r.headers.get('X-Orbit-Graph') || 0);
    if (loadText(text, false, false)) { live.graph = Math.max(live.graph, g); live.pending = false; }
    live.error = null;
  } catch (e) {
    live.error = e.message;
  }
  live.busy = false;
  renderLive();
};

function initServer() {
  $('#offline').hidden = true;
  $('#live').hidden = false;
  try { live.auto = localStorage.getItem('jj-orbit:auto') !== '0'; } catch { /* ignore */ }
  renderLive();
  connectLive();
}

if (SERVER) initServer();
else {
  let stored = null;
  try { stored = localStorage.getItem(STORE_KEY); } catch { stored = null; }
  if (!(stored && loadText(stored, false))) loadText($('#demo-data').textContent, true);
}
requestAnimationFrame(frame);
})();
</script>
