<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jj orbit</title>
<meta name="jj-orbit-version" content="0.32.2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --void: #E9EEF6;
  --panel: rgba(250, 252, 255, 0.92);
  --panel-solid: #F7F9FC;
  --line: #C8D2E2;
  --ink: #111827;
  --ink-dim: #556179;
  --cyan: #00879E;
  --magenta: #BE0F7A;
  --warn: #CF1F3A;
  --amber: #9A6200;
  --chip: rgba(0, 135, 158, 0.10);
  --shadow: 0 8px 30px rgba(30, 50, 90, 0.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --void: #060912;
    --panel: rgba(10, 15, 28, 0.86);
    --panel-solid: #0A0F1C;
    --line: #1B2540;
    --ink: #D6E2F5;
    --ink-dim: #7E8DAA;
    --cyan: #29F3FF;
    --magenta: #FF3DB8;
    --warn: #FF4D5E;
    --amber: #FFC23D;
    --chip: rgba(41, 243, 255, 0.10);
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  --void: #060912;
  --panel: rgba(10, 15, 28, 0.86);
  --panel-solid: #0A0F1C;
  --line: #1B2540;
  --ink: #D6E2F5;
  --ink-dim: #7E8DAA;
  --cyan: #29F3FF;
  --magenta: #FF3DB8;
  --warn: #FF4D5E;
  --amber: #FFC23D;
  --chip: rgba(41, 243, 255, 0.10);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
}
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--void); color: var(--ink);
  font: 400 14px/1.45 var(--ui);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 310px minmax(0, 1fr); height: 100%; }

/* sidebar */
.side {
  display: flex; flex-direction: column; min-height: 0;
  background: var(--panel); border-right: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  z-index: 5;
}
.brand { padding: 18px 18px 10px; }
.brand h1 {
  margin: 0; font-weight: 600; font-size: 24px; letter-spacing: 0.02em; line-height: 1.1;
  display: flex; align-items: center; gap: 10px;
}
.brand h1 svg { flex: none; }
.brand h1 .ver { font: 400 11px var(--mono); color: var(--ink-dim); align-self: flex-end; margin-bottom: 3px; }
.verwarn { margin: 6px 0 2px; padding: 5px 8px; border-radius: 6px; font-size: 12px; color: var(--warn); border: 1px solid currentColor; background: color-mix(in srgb, var(--warn) 10%, transparent); }
.meta { margin-top: 8px; font: 400 11.5px/1.5 var(--mono); color: var(--ink-dim); word-break: break-all; }
.meta .demo { color: var(--amber); }
.warns summary { cursor: pointer; color: var(--amber); }
.warns ul { margin: 4px 0 0; padding-left: 16px; max-height: 160px; overflow-y: auto; }
.warns li { margin-bottom: 3px; }
.tools { padding: 6px 18px 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.search {
  width: 100%; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: transparent;
}
.search::placeholder { color: var(--ink-dim); }
.bulk { display: flex; gap: 5px; flex-wrap: wrap; }
.bulk button { font-size: 12.5px; padding: 3px 8px; }
.bulk button, .hud button, .opbar button, .foot button, .info button {
  border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 4px 10px;
}
.bulk button:hover, .hud button:hover, .foot button:hover, .info button:hover { border-color: var(--cyan); }
.count { font: 400 11.5px var(--mono); color: var(--ink-dim); }
.revset { display: grid; gap: 3px; position: relative; }
.revset[hidden] { display: none; }
.revset input { font-family: var(--mono); font-size: 12.5px; }
.revwrap { position: relative; }
.revwrap input { position: relative; background: transparent; color: transparent; caret-color: var(--ink); width: 100%; }
.revwrap input::placeholder { color: var(--ink-dim); }
.revset-hl { position: absolute; inset: 0; padding: 7px 10px; border: 1px solid transparent; font: 400 12.5px var(--mono); white-space: pre; overflow: hidden; pointer-events: none; color: var(--ink); }
.rs-fn { color: var(--cyan); }
.rs-bad { color: var(--warn); text-decoration: underline wavy; }
.rs-op { color: var(--magenta); }
.rs-str { color: #8fd18f; }
.rs-sym { color: var(--amber); }
.rs-id { color: var(--ink-dim); }
.rs-kw { color: #9b7bff; }
.revset-sugg { position: absolute; z-index: 30; left: 0; right: 0; top: 36px; max-height: 300px; overflow-y: auto; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.revset-sugg[hidden] { display: none; }
.revset-sugg .sg { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 0 6px; padding: 4px 8px; cursor: pointer; }
.revset-sugg .sg.on, .revset-sugg .sg:hover { background: var(--chip); }
.revset-sugg code { font: 400 12px var(--mono); }
.revset-sugg small { grid-column: 2; color: var(--ink-dim); font-size: 11.5px; }
.revset-sugg small b { font-family: var(--mono); font-weight: 400; color: var(--ink); }
.sgk { color: var(--ink-dim); text-align: center; }
.sgk.function { color: var(--cyan); }
.sgk.bookmark { color: var(--amber); }
.revset-msg { font: 400 11.5px var(--mono); color: var(--ink-dim); }
.revset-msg.bad { color: var(--warn); white-space: pre-wrap; }
.scope { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.scope .lead { font-size: 12.5px; color: var(--ink-dim); margin-right: 2px; }
.scope button {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 1px 9px; font-size: 12.5px;
}
.scope button:hover:not(:disabled) { border-color: var(--cyan); }
.scope button[aria-pressed="true"] { background: var(--chip); border-color: var(--cyan); color: var(--cyan); }
.scope button:disabled { opacity: 0.4; cursor: default; }
.scope button small { font: 400 10.5px var(--mono); color: var(--ink-dim); margin-left: 3px; }
.row.ctx .label { font-style: italic; color: var(--ink-dim); }

.list { flex: 1; overflow-y: auto; padding: 6px 0 10px; min-height: 120px; }
.state { padding: 8px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; max-height: 34vh; overflow-y: auto; }
.state h2 { margin: 4px 4px 2px; font-size: 12.5px; font-weight: 500; color: var(--ink-dim); }
.state h2:first-child { margin-top: 0; }
.state .none { margin: 0 4px 4px; font-size: 12.5px; color: var(--ink-dim); }
.dv {
  display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 7px; align-items: center;
  border: 1px solid transparent; background: none; text-align: left; padding: 3px 5px; border-radius: 5px; width: 100%;
}
.dv:hover { background: var(--chip); }
.wsrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 2px; }
.wsrow input { margin: 0 0 0 4px; accent-color: var(--cyan); }
.wsrow.off .dv { opacity: 0.45; }
.dv[aria-pressed="true"] { border-color: var(--magenta); background: var(--chip); }
.dv .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
.dv .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 500 12.5px var(--mono); }
.dv .name small { font: 400 11.5px var(--ui); color: var(--ink-dim); margin-left: 4px; }
.dv .st { font: 400 11.5px var(--mono); color: var(--ink-dim); white-space: nowrap; }
.jid { font-family: var(--mono); white-space: nowrap; }
.jid .pfx { color: var(--magenta); font-weight: 600; }
.jid .cpfx { color: var(--cyan); font-weight: 600; }
.jid .idr { color: var(--ink-dim); font-weight: 400; }
.up { color: var(--cyan); }
.down { color: var(--magenta); }
.cf { color: var(--warn); }
.snap[hidden] { display: none; }
.snap { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--ink-dim); }
.snap button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 1px 9px; }
.snap button:hover { border-color: var(--cyan); }
.snap button:disabled { opacity: 0.4; cursor: default; }
.cmp h2 { margin-top: 0; }
.cmp-side { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 2px 8px; align-items: baseline; margin: 6px 0; }
.cmp-side .dot { width: 9px; height: 9px; border-radius: 50%; align-self: center; }
.cmp-side b { font: 600 13px var(--mono); overflow-wrap: anywhere; }
.cmp-side span.n { grid-column: 2; color: var(--ink-dim); font-size: 12.5px; }
.cmp-fork { font-size: 12.5px; color: var(--ink-dim); margin-top: 8px; }
.cmp-fork code { font: 600 12px var(--mono); color: var(--ink); }
.hint { font-size: 12.5px; color: var(--ink-dim); margin: 4px 0 0; }
.row {
  position: relative; display: grid; grid-template-columns: 18px 16px minmax(0,1fr) auto auto; align-items: center; gap: 6px;
  padding: 4px 12px 4px calc(14px + var(--depth, 0) * 14px);
}
.row::before { content: ""; position: absolute; left: calc(6px + var(--depth, 0) * 14px); top: 5px; bottom: 5px; width: 3px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); }
.row:hover { background: var(--chip); }
.row.off { opacity: 0.45; }
.row.off::before { box-shadow: none; }
.row input { margin: 0; accent-color: var(--cyan); }
.row .glyph { font: 600 13px var(--mono); color: var(--ink-dim); text-align: center; }
.row .glyph.conflict { color: var(--warn); }
.row .glyph.wc { color: var(--cyan); }
.row .label { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: none; border: 0; padding: 0; text-align: left; }
.row .label small { color: var(--ink-dim); font-size: 12px; }
.row .n { font: 400 11px var(--mono); color: var(--ink-dim); }
.row .solo { border: 0; background: none; padding: 0 2px; color: var(--ink-dim); opacity: 0; font-size: 13px; }
.row:hover .solo, .row .solo:focus-visible { opacity: 1; }
.row .solo:hover { color: var(--magenta); }

.foot { padding: 10px 18px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.foot .actions { display: flex; flex-wrap: wrap; gap: 6px; }
.foot-sec { display: grid; gap: 8px; }
.foot-sec[hidden] { display: none; }
.live-status { font: 400 11.5px/1.5 var(--mono); color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-status .ldot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 6px currentColor; }
.foot button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); background: var(--chip); }
.foot button:disabled { opacity: 0.5; cursor: default; }
#live-apply { border-color: var(--magenta); color: var(--magenta); }
.foot code { font: 400 11px/1.5 var(--mono); color: var(--ink-dim); display: block; }
.legend-wrap summary { cursor: pointer; font-size: 12.5px; color: var(--ink-dim); }
.legend-wrap[open] summary { margin-bottom: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-dim); }
.legend b { font: 600 12px var(--mono); margin-right: 3px; color: var(--ink); }
.legend b.x { color: var(--warn); }
.legend b.at { color: var(--cyan); }
.err { color: var(--warn); font-size: 12.5px; }

/* stage */
.stage { position: relative; min-width: 0; overflow: hidden; }
#gl, #labels { position: absolute; inset: 0; }
#labels { pointer-events: none; z-index: 1; }
.hud {
  position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
  max-width: calc(100% - 24px); z-index: 3;
}
.hud .group { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hud .group button { border-color: transparent; }
.hud .cmpchip { display: none; border-color: var(--magenta) !important; color: var(--magenta); background: var(--panel) !important; }
.hud .cmpchip.on { display: inline-block; }
.hud button[aria-pressed="true"] { background: var(--chip); border-color: var(--cyan); color: var(--cyan); }
.hud .twist { display: none; align-items: center; gap: 6px; padding: 0 8px; font-size: 12.5px; color: var(--ink-dim); }
.hud .twist.on { display: flex; }
.hud .twist input { width: 90px; accent-color: var(--cyan); }
.menu-btn { display: none; }

.opbar {
  position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 3;
  display: none; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.opbar.on { display: grid; }
.opbar .btns { display: flex; gap: 4px; grid-row: span 2; }
.opbar input { width: 100%; accent-color: var(--magenta); margin: 0; }
.opbar .oplabel { font: 400 12px/1.4 var(--mono); color: var(--ink-dim); white-space: nowrap; display: flex; gap: 12px; min-width: 0; }
.opbar .oplabel .opd { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.opbar .oplabel .opt, .opbar .oplabel .opn { flex: none; }
.opbar .oplabel .opn { color: var(--ink); font-variant-numeric: tabular-nums; }
.opbar .btns { flex-wrap: wrap; }
.opbar .oplabel b { color: var(--magenta); font-weight: 600; }
.opbar.live .oplabel b { color: var(--cyan); }

.info {
  position: absolute; top: 60px; right: 12px; width: min(360px, calc(100% - 24px)); max-height: calc(100% - 150px);
  overflow-y: auto; z-index: 4; display: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 14px 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.info.on { display: block; }
.info .close { position: absolute; top: 8px; right: 8px; border: 0 !important; font-size: 18px; line-height: 1; padding: 2px 6px !important; }
.info .ids { font: 400 13px/1.6 var(--mono); }
.info .ids .pfx { color: var(--magenta); font-weight: 600; }
.info .ids .cpfx { color: var(--cyan); font-weight: 600; }
.info .ids .cfm { color: var(--warn); font-weight: 600; }
.info .ids span.k { color: var(--ink-dim); display: inline-block; width: 64px; font-family: var(--ui); font-size: 12px; }
.info h2 { margin: 10px 0 4px; font-size: 16px; font-weight: 600; line-height: 1.3; white-space: pre-wrap; overflow-wrap: anywhere; }
.info .body { white-space: pre-wrap; color: var(--ink-dim); font-size: 13px; margin: 0 0 6px; overflow-wrap: anywhere; }
.info .by { color: var(--ink-dim); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
.chip { font: 400 11.5px var(--mono); padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); }
.chip.bm { color: var(--amber); border-color: currentColor; }
button.chip { background: transparent; cursor: pointer; line-height: inherit; }
button.chip:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
.chip.flag-conflict { color: var(--warn); border-color: currentColor; }
.chip.flag-wc { color: var(--cyan); border-color: currentColor; }
.chip.flag-div { color: var(--magenta); border-color: currentColor; }
.info h3 { margin: 14px 0 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-dim); }
.info.wide { width: min(720px, calc(100% - 24px)); }
.info.xwide { width: min(1180px, calc(100% - 24px)); }
.info .maxbtn { position: absolute; top: 8px; right: 36px; border: 0 !important; font-size: 14px; line-height: 1; padding: 3px 6px !important; color: var(--ink-dim); }
.info .maxbtn:hover { color: var(--cyan); }
#info-resizer { position: absolute; z-index: 5; width: 8px; cursor: ew-resize; display: none; }
#info-resizer::after { content: ''; position: absolute; left: 3px; top: 50%; height: 36px; margin-top: -18px; width: 2px; border-radius: 1px; background: var(--line); }
#info-resizer:hover::after, #info-resizer.drag::after { background: var(--cyan); }
.files { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.files .file { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; width: 100%;
  border: 0 !important; background: none; padding: 3px 4px !important; border-radius: 4px; text-align: left; font-size: 12.5px; }
.files .file:hover, .files .file[aria-expanded="true"] { background: var(--chip); }
.files .fs { font: 600 11.5px var(--mono); text-align: center; }
.fs-added, .fs-copied { color: var(--cyan); }
.fs-modified { color: var(--amber); }
.fs-removed { color: var(--magenta); }
.fs-renamed { color: var(--ink); }
.files .fp { font: 400 12px var(--mono); overflow-wrap: anywhere; }
.files .fp .dir { color: var(--ink-dim); }
.files .fp small { color: var(--ink-dim); }
.files .fn { font: 400 11px var(--mono); white-space: nowrap; }
.diff { margin: 4px 0 8px; padding: 6px 0; max-height: 50vh; overflow: auto; border-radius: 6px; background: color-mix(in srgb, var(--panel-solid) 85%, var(--void));
  font: 400 11.5px/1.45 var(--mono); border: 1px solid var(--line); }
.diff span { display: block; padding: 0 10px; white-space: pre; min-width: max-content; }
.diff span span:not(.sc):not(.sfull), .diff label span, .diff .bl span { display: inline; padding: 0; min-width: 0; }
.diff .add { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 9%, transparent); }
.diff .del { color: var(--magenta); background: color-mix(in srgb, var(--magenta) 9%, transparent); }
.diff .hunk { color: var(--amber); }
.diff .dmeta { color: var(--ink-dim); }
.acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; align-items: center; }
.actgroups { display: grid; gap: 4px; }
.actlbl { font-size: 11.5px; color: var(--ink-dim); width: 86px; }
.actgroups { gap: 5px; margin-top: 4px; }
.actgroups > .acts { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 6px; margin: 0; padding: 6px 8px 6px 2px; border-radius: 8px;
  background: color-mix(in srgb, var(--g) 7%, transparent); border-left: 2px solid color-mix(in srgb, var(--g) 55%, transparent); align-items: stretch; }
.actgroups > .acts > .actlbl { width: auto; writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; font-size: 9.5px;
  text-transform: uppercase; letter-spacing: .1em; color: color-mix(in srgb, var(--g) 80%, var(--ink)); white-space: nowrap; }
.actbtns { display: flex; flex-wrap: wrap; gap: 4px; align-content: center; }
#helptip.wide { max-width: 420px; }
#helptip .ahl { display: block; color: var(--ink); margin-bottom: 3px; }
#helptip .actpic { display: block; margin: 8px 0 4px; }
#helptip .actpic line.pe { stroke: var(--ink-dim); stroke-width: 1.4; }
#helptip .actpic circle { stroke-width: 1.4; }
#helptip .actpic circle.pn { fill: var(--panel-solid); stroke: var(--ink-dim); }
#helptip .actpic circle.pm { fill: color-mix(in srgb, var(--magenta) 30%, var(--panel-solid)); stroke: var(--magenta); }
#helptip .actpic circle.pd { fill: color-mix(in srgb, var(--cyan) 25%, var(--panel-solid)); stroke: var(--cyan); }
#helptip .actpic text { font: 600 10.5px var(--mono); text-anchor: middle; fill: var(--ink); }
#helptip .actpic text.parrow { font-size: 18px; fill: var(--ink-dim); }
#helptip .acmd { display: block; margin-top: 4px; }
#helptip .awhy { margin-top: 4px; color: var(--amber); }
#helptip .cmdlist code { display: block; margin: 2px 0; }
.ids[data-cmds] .k { text-decoration: underline dotted color-mix(in srgb, var(--ink-dim) 70%, transparent); text-underline-offset: 3px; cursor: help; }
.filepick { max-height: 200px; overflow-y: auto; }
.filepick label { grid-template-columns: 18px minmax(0, 1fr); }
.actform .plain { display: block; font-size: 12px; color: var(--ink-dim); }
.frow { display: flex; gap: 4px; align-items: center; }
.frow .file { flex: 1; min-width: 0; }
.fmenu { border: 0 !important; background: none; color: var(--ink-dim); padding: 0 6px !important; font-size: 12px; }

#labels .foldlbl:hover { color: var(--cyan); border-color: var(--cyan); }
#labels .foldlbl.open { opacity: 0.55; }
.sec-b[hidden] { display: none !important; }
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--ink-dim) 40%, transparent) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--ink-dim) 40%, transparent); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--cyan) 55%, transparent); }
.sec-h { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
.sec-h .chev { display: inline-block; width: 10px; font-size: 10px; color: var(--ink-dim); transition: transform .15s; }
.sec-h.closed .chev { transform: rotate(-90deg); }
.sec-h small { color: var(--ink-dim); font-weight: 400; margin-left: auto; }
.info > h3.sec-h { margin-top: 12px; }
.info > h3.sec-h.closed { color: var(--ink-dim); }
#list-bm { margin-left: 8px; text-transform: none; letter-spacing: 0; font-size: 11.5px; }
.side > .sec-h { margin: 6px 18px 2px; font-size: 12px; font-weight: 500; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .04em; }
.scope.folds { margin-top: 4px; }
.chipsel { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--ink); }
.chipsel select { font: inherit; background: transparent; color: var(--ink); border: 0; padding: 0; }
.chipsel input { margin: 0; accent-color: var(--cyan); }
.automore select { font: inherit; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
.linkbtn { border: 0 !important; background: none !important; padding: 0 !important; color: var(--cyan); font-size: 12px; cursor: pointer; margin-left: 6px; }
.linkbtn:hover { text-decoration: underline; }
.evo { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

.cmd { display: flex; align-items: center; gap: 6px; }

.cmd button { padding: 2px 8px !important; font-size: 12px; }

.tip {
  position: absolute; z-index: 6; pointer-events: none; display: none; max-width: 340px;

  font-size: 12.5px; box-shadow: var(--shadow);
}
.tip .jid { font-size: 12px; margin-right: 6px; }
.tip .d { color: var(--ink); }
.tip .m { display: block; color: var(--ink-dim); font-size: 11.5px; }
.tip .d1 { color: var(--ink); }

.lblwrap { width: 0; height: 0; }
.lbl {
  position: absolute; left: 14px; top: 0; transform: translateY(-50%);
  font: 500 11px var(--mono); padding: 1px 6px; border-radius: 4px; white-space: nowrap;
  color: var(--amber); background: color-mix(in srgb, var(--panel-solid) 62%, transparent); border: 1px solid currentColor;
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.15s;
}
.lbl.compact { font-size: 10px; padding: 0 5px; max-width: 120px; }
.lbl.occ { opacity: 0.1 !important; }
.lbl.pin { box-shadow: 0 0 0 1px currentColor, 0 0 10px color-mix(in srgb, currentColor 35%, transparent); }
.lbl.hot { opacity: 1 !important; background: var(--panel-solid); }
.lbl.remote { color: var(--ink-dim); border-color: var(--line); opacity: 0.7; }
.lbl.ws { font-weight: 600; top: -16px; color: var(--void) !important; border-color: transparent; border-radius: 9px; opacity: 1; }
.lbl.ws.cur { background: var(--cyan); }
.lbl .cfm { color: var(--warn); }
.lbl .rem { color: var(--ink-dim); font-weight: 400; }

.idl {
  position: absolute; right: 13px; top: 0; transform: translateY(-50%);

  text-shadow: 0 0 3px var(--void), 0 0 3px var(--void), 0 0 2px var(--void);
}

.idl i { font-style: normal; color: var(--warn); }

.drop {
  position: absolute; inset: 0; z-index: 20; display: none; place-items: center;
  background: color-mix(in srgb, var(--void) 80%, transparent); border: 2px dashed var(--cyan);
  font-size: 20px; color: var(--cyan);
}

@media (max-width: 760px) {

}

}

<body>
<div class="app">
  <aside class="side" id="side" aria-label="Branches">
    <div class="brand">
      <h1>
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
          <ellipse cx="13" cy="13" rx="11" ry="4.5" fill="none" stroke="var(--cyan)" stroke-width="1.4" transform="rotate(-28 13 13)"/>
          <circle cx="13" cy="13" r="3" fill="var(--magenta)"/>
          <circle cx="22.2" cy="8.2" r="1.7" fill="var(--cyan)"/>
        </svg>
        jj orbit <small class="ver" id="ver" title="Viewer version"></small>
      </h1>
      <div class="verwarn" id="verwarn" role="alert" hidden></div>
      <div class="meta" id="meta"></div>
      <div class="snap" id="snap" hidden>
        <button id="snap-prev" aria-label="Previous demo state">‹</button>
        <span id="snap-label"></span>
        <button id="snap-next" aria-label="Next demo state">›</button>
      </div>
    </div>
    <div class="state" id="state" aria-label="Workspaces and divergence"></div>
    <div class="untracked" id="untracked" hidden></div>
    <h2 class="sec-h" data-sec="filters"><span class="chev" aria-hidden="true">▾</span>Filters</h2>
    <div class="tools sec-b">
      <div class="revset" id="revsetbox" hidden>
        <div class="revwrap"><div class="revset-hl" id="revset-hl" aria-hidden="true"></div><input class="search" id="revset" type="search" list="revset-presets" placeholder="Revset, e.g. mine() &amp; mutable()" aria-label="Revset" spellcheck="false" autocomplete="off"></div>
        <div class="revset-sugg" id="revset-sugg" role="listbox" hidden></div>
        <datalist id="revset-presets">
          <option value="mine() &amp; mutable()"><option value="conflicts()"><option value="divergent()"><option value="trunk()..@">
          <option value="heads(mutable())"><option value="bookmarks()"><option value="remote_bookmarks() ~ ::trunk()">
          <option value="working_copies()"><option value="mutable() &amp; empty()"><option value="description(substring:&quot;wip&quot;)">
        </datalist>
        <div class="revset-msg" id="revset-msg"></div>
      </div>
      <input class="search" id="filter" type="search" placeholder="Filter branches" title="Searches bookmarks, descriptions, authors and ids" aria-label="Filter branches">
      <div class="bulk">
        <button id="b-all" title="Also resets the criteria">Show all</button>
        <button id="b-none">Hide all</button>
        <button id="b-match" title="Only show branches matching the text filter">Show matches</button>
      </div>
      <div class="scope" id="scope" role="group" aria-label="Only show branches matching all selected criteria"></div>
      <div class="scope folds">
        <span class="lead">Fold:</span>
        <label class="chipsel" data-help="Side branches without commits in this period (relative to the newest commit shown) collapse into a marker at their fork. Branches with a workspace or revset hits stay visible.">idle &gt; <select id="idledays"><option value="0">never</option><option value="14">14 d</option><option value="30">30 d</option><option value="90">90 d</option><option value="365">1 y</option></select></label>
        <label class="chipsel" data-help="Side branches that were merged into another branch (their tip is a second parent of a merge) fold into a ⧉ badge on the merge commit. Click the badge to unfold."><input type="checkbox" id="foldmerged"> merged</label>
      </div>
      <div class="count" id="count"></div>
    </div>
    <h2 class="sec-h" data-sec="branches"><span class="chev" aria-hidden="true">▾</span>Branches <button class="linkbtn" id="list-bm" data-bmmanager hidden title="Shift+B: all bookmarks, their sync state, push, track and cleanup">manage bookmarks</button><small id="list-n"></small></h2>
    <div class="list sec-b" id="list" role="list"></div>
    <div class="foot">
      <details class="legend-wrap"><summary>Legend</summary><label class="automore" data-help="Older commits load when the “older commits” marker below the oldest trunk commit comes into view up close (up to 1000 trunk commits). Older operations load when you scrub to the oldest one (up to 1000). The marker and the ⋯ button in the operation bar always work."><input type="checkbox" id="automore"> Load older history automatically</label>

      <div class="legend">
        <span><b>◆</b>immutable</span><span><b>○</b>mutable</span><span><b class="at">@</b>working copy</span><span><b class="x">×</b>conflict</span><span><b>◇</b>earlier version</span><span>wire sphere: empty commit</span><span><b>main</b>@origin in sync</span><span><b class="x">*</b>differs</span><span>dashed: local only</span><span>shift-click two commits to compare</span><span>double-click: edit / new</span>
      </div>
      </details>
      <div id="offline" class="foot-sec">
        <div class="actions">
          <button id="load">Load export</button>
          <button id="demo">Demo</button>
          <input type="file" id="file" accept=".json,application/json" hidden>
        </div>
        <code>python3 jj_export.py -R ~/repo --ops 100</code>
      </div>
      <div id="live" class="foot-sec" hidden>
        <div class="live-status" id="live-status" role="status"></div>
        <div class="windowctl" id="windowctl" hidden></div>
        <div class="actions">
          <button id="live-refresh" title="Key R: snapshot the working copy and reload">Reload</button>
          <button id="live-auto" aria-pressed="true" title="Apply new states after every jj operation automatically">Auto</button>
          <button id="live-apply" hidden>Show new state</button>
          <button id="export-state" title="Export the viewer state as JSON, e.g. for a bug report">Export</button>
          <button id="live-bookmarks" title="Shift+B: all bookmarks, their sync state, push, track and cleanup">Bookmarks</button>
          <button id="live-activity" title="jj commands run from this page">Activity</button>
        </div>
      </div>
      <div class="err" id="err" role="status"></div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div id="gl"></div>
    <div id="labels"></div>
    <div class="hud">
      <button class="menu-btn" id="menu" aria-controls="side" aria-expanded="false">Branches</button>
      <button class="cmpchip" id="cmp-exit" title="Esc">End comparison ×</button>
      <div class="group" role="group" aria-label="Layout">
        <button id="lay-lanes" aria-pressed="true" title="Key 1">Lanes</button>
        <button id="lay-spiral" aria-pressed="false" title="Key 2">Spiral</button>
        <button id="lay-flat" aria-pressed="false" title="Key 3: flat log view, one row per commit, newest on top; drag pans">2D</button>
      </div>
      <div class="group" role="group" aria-label="Layers">
        <button id="t-evo" aria-pressed="true" title="Key E: earlier versions (evolog)">Evolog</button>
        <button id="t-ab" aria-pressed="false" title="Key A: abandoned changes from the op log">Abandoned</button>
        <button id="t-elide" aria-pressed="true" title="Key L: collapse long runs of plain immutable commits, like jj log">Elide</button>
        <button id="t-moves" aria-pressed="true" title="Key M: detect moved code in the selected commit (ReviewDiff engine) and show it around the node" hidden>Moves</button>
        <button id="t-div" aria-pressed="true" title="Key D: link visible versions of the same change (magenta: divergent locally, amber: remote, workspace colour: created in another workspace)">Divergence</button>
        <button id="t-bm" aria-pressed="true" title="Key B: bookmarks full, short or off">Bookmarks</button>
        <button id="t-ids" aria-pressed="false" title="Key I: shortest unique change-id prefix on every node">IDs</button>
        <button id="t-glow" aria-pressed="true">Glow</button>
        <button id="touchpad" title="Same for touchpad and mouse: pinch or ctrl+scroll zooms at the cursor, sideways swipe pans, drag rotates, right- or shift-drag pans. In 2D, scrolling scrolls. Click to choose whether vertical scrolling zooms or pans in 3D.">Scroll: zoom</button>
        <button id="fit" title="Key F">Fit</button>
      </div>
    </div>
    <div class="info" id="info" aria-live="polite"></div>
    <div class="opbar" id="opbar">
      <div class="btns">
        <button id="op-more" title="Load older operations" hidden>⋯</button>
        <button id="op-prev" title="Arrow left" aria-label="Previous operation">‹</button>
        <button id="op-play" aria-label="Play the op log">▶</button>
        <button id="op-next" title="Arrow right" aria-label="Next operation">›</button>
        <button id="op-last" title="Jump to now (End)" aria-label="Latest operation">⇥</button>
        <button id="op-undo" title="jj undo: undo the last operation" hidden>Undo</button><button id="op-redo" title="jj redo: redo the most recently undone operation" hidden>Redo</button>
        <button id="op-details" title="What this operation changed (jj op show)" hidden>Details</button>
        <button id="op-restore" title="Restore the repo to this state (jj op restore)" hidden>Restore …</button>
        <button id="op-forget" title="jj op abandon ..op-: drop all operations before this one from the op log (keeps the repo as it is)" hidden>Forget older …</button>
      </div>
      <input type="range" id="op" min="0" max="0" value="0" aria-label="Operation">
      <div class="oplabel" id="oplabel"></div>
    </div>
    <div class="opdetails" id="opdetails" hidden></div>
    <div class="opdetails" id="activity" hidden></div>
    <div class="tip" id="tip"></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="drop" id="drop">Drop an export here</div>
  </main>
</div>

<script>
(() => {
'use strict';

const $ = (s) => document.querySelector(s);
const GOLDEN = Math.PI * (3 - Math.sqrt(5));
const DY = 1.15, DX = 1.7, DZ = 0.85;
// index 0 is the trunk and the only yellow; branches take the others
const PAL_DARK = ['#FFD84A', '#29F3FF', '#FF3DB8', '#4DFF88', '#9B7BFF', '#FF7A3D', '#3DFFB0', '#FF5C7A', '#5CA8FF', '#FF9DF0', '#7DFFEA'];
const PAL_LIGHT = ['#A67C00', '#00879E', '#BE0F7A', '#1F8A3A', '#5B3FD6', '#C24A00', '#00875A', '#C3203F', '#1D5FC2', '#A8329A', '#00857A'];
const WS_DARK = ['#9B7BFF', '#5CA8FF', '#3DFFB0', '#D9A6FF', '#8FA6FF', '#6FE3C8'];
const WS_LIGHT = ['#5B3FD6', '#1D5FC2', '#00875A', '#8A3FB0', '#3F5FA8', '#127A68'];
const STORE_KEY = 'jj-orbit:last';
const SERVER = (() => { try { return JSON.parse(document.getElementById('demo-data').textContent).server === true; } catch { return false; } })();
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const state = {
  raw: null, isDemo: true, model: null, deco: null,
  layout: 'lanes', twist: 0, evoMode: 'sel', showSnaps: false, showAbandoned: false, glow: true,
  op: -1, hidden: new Set(), colorOf: new Map(), selected: null, hoverBranch: -1, filter: '',
  compareSpec: null, compare: null, pickA: -1, snaps: null, snapIdx: 0, showIds: false, hiddenWs: new Set(), scope: [], bmMode: 'full', showDiv: true,
};

/* ---------- model ---------- */

function uniq(a) { return [...new Set(a)]; }
function firstLine(s) { return (s || '').split('\n')[0]; }

function buildModel(raw) {
  const commits = raw.commits;
  const ops = raw.ops || [];
  const evo = raw.evolog || {};
  const byId = new Map(commits.map((c, i) => [c.id, i]));
  const lastSeen = new Int32Array(commits.length).fill(-1);
  ops.forEach((op, k) => op.visible.forEach((i) => { lastSeen[i] = k; }));

  const nodes = [];
  const keyOf = new Int32Array(commits.length).fill(-1);
  const currentByChange = new Map();
  commits.forEach((c, i) => {
    if (c.gone) return;
    keyOf[i] = nodes.length;
    nodes.push({ k: nodes.length, rep: c, repIdx: i, abandoned: false, versions: [i] });
    if (!currentByChange.has(c.cid)) currentByChange.set(c.cid, keyOf[i]);
  });
  const abandonedByChange = new Map();
  commits.forEach((c, i) => {
    if (!c.gone) return;
    if (currentByChange.has(c.cid)) {
      const n = nodes[currentByChange.get(c.cid)];
      keyOf[i] = n.k; n.versions.push(i);
      return;
    }
    let n = abandonedByChange.get(c.cid);
    if (!n) {
      n = { k: nodes.length, rep: c, repIdx: i, abandoned: true, versions: [] };
      nodes.push(n); abandonedByChange.set(c.cid, n);
    }
    n.versions.push(i); keyOf[i] = n.k;
    if (lastSeen[i] > lastSeen[n.repIdx]) { n.rep = c; n.repIdx = i; }
  });
  const toKeys = (ids, self) => uniq((ids || []).map((p) => byId.get(p)).filter((x) => x !== undefined).map((x) => keyOf[x]).filter((k) => k >= 0 && k !== self));
  for (const n of nodes) {
    n.parents = toKeys(n.rep.parents, n.k);
    n.elided = toKeys(n.rep.elided, n.k).filter((k) => !n.parents.includes(k));
    n.evo = n.abandoned ? [] : (evo[n.rep.id] || []);
    n.text = [n.rep.desc, n.rep.author, n.rep.email, n.rep.cid, n.rep.id, ...n.rep.lb, ...n.rep.rb, ...(n.rep.tags || [])].join(' ').toLowerCase();
  }
  let trunk = -1;
  if (raw.meta && raw.meta.trunk && byId.has(raw.meta.trunk)) trunk = keyOf[byId.get(raw.meta.trunk)];
  const keyOfId = (id) => { const i = byId.get(id); return i === undefined ? -1 : keyOf[i]; };
  const bookmarks = raw.bookmarks || [];
  const bmState = new Map(bookmarks.map((b) => [b.remote ? b.name + '@' + b.remote : b.name, b]));
  const remoteNames = new Set(commits.flatMap((c) => c.rb || []));
  const ids = new Map();
  const putId = (id, p, k, force) => {
    if (!id || !p) return;
    if (force || !ids.has(id)) ids.set(id, { p, k });
    const sh = id.slice(0, 12);
    if (force || !ids.has(sh)) ids.set(sh, { p, k });
  };
  for (const list of Object.values(evo)) for (const e of list) { putId(e.id, e.ip, 'c'); putId(e.cid, e.cp, 'h'); }
  for (const c of commits) if (c.gone) { putId(c.id, c.ip, 'c'); putId(c.cid, c.cp, 'h'); }
  for (const c of commits) if (!c.gone) { putId(c.id, c.ip, 'c', true); putId(c.cid, c.cp, 'h', true); }
  for (const b of bookmarks) if (b.remote) remoteNames.add(b.name + '@' + b.remote);
  const workspaces = raw.workspaces || [];
  const cur = workspaces.find((w) => w.current);
  const curWs = cur ? cur.name : (commits.find((c) => c.wc && !c.gone) || { wcs: ['default'] }).wcs[0] || 'default';
  const wsNames = uniq(workspaces.map((w) => w.name).concat(commits.flatMap((c) => c.wcs || []))).sort((a, b) => (b === curWs) - (a === curWs) || a.localeCompare(b));
  const byChange = new Map();
  const appeared = new Map();
  ops.forEach((op, k) => {
    if (k === 0) { op.visible.forEach((i) => appeared.set(i, null)); return; }
    op.visible.forEach((i) => { if (!appeared.has(i)) appeared.set(i, op.ws || null); });
  });
  for (const n of nodes) {
    n.origin = appeared.get(n.repIdx) || null;
    n.remoteOnly = !n.abandoned && !n.rep.lb.length && !(n.rep.wcs || []).length && n.rep.rb.length > 0 && !n.rep.divergent;
  }
  for (const n of nodes) if (!n.abandoned) { if (!byChange.has(n.rep.cid)) byChange.set(n.rep.cid, []); byChange.get(n.rep.cid).push(n.k); }
  const divGroups = [...byChange.values()].filter((g) => g.length > 1);
  return { commits, ops, byId, keyOf, keyOfId, nodes, trunk, meta: raw.meta || {}, bookmarks, bmState, remoteNames, ids, workspaces, curWs, wsNames, divGroups };
}

function parentsOf(k) {
  const o = state.sim && state.sim.parents.get(k);
  if (o) return o;
  const e = state.elide && state.elide.parents.get(k);
  return e || state.model.nodes[k].parents;
}
function elidedOf(k) {
  const e = state.elide && state.elide.links.get(k);
  return e ? state.model.nodes[k].elided.concat(e) : state.model.nodes[k].elided;
}

/* Eliding like the jj CLI: long runs of plain immutable commits collapse into a dashed edge with a count.
   The commit on top and the one at the bottom of a run stay visible; clicking the count expands the run. */
state.showElide = true;
state.elideOpen = new Set();
function computeElision(model) {
  const res = { hidden: new Set(), parents: new Map(), links: new Map(), groups: [] };
  if (!state.showElide) return res;
  const nodes = model.nodes, N = nodes.length;
  const kids = Array.from({ length: N }, () => []);
  for (const n of nodes) if (!n.abandoned) for (const p of n.parents) kids[p].push(n.k);
  const plain = (k) => {
    const n = nodes[k], c = n.rep;
    return !n.abandoned && c.immutable && n.parents.length === 1 && kids[k].length === 1 && !c.lb.length && !c.rb.length
      && !(c.tags && c.tags.length) && !c.wc && !(c.wcs && c.wcs.length) && !c.conflict && !c.divergent && k !== model.trunk
      && !n.elided.length && !(state.revsetHits && state.revsetHits.has(k));
  };
  const done = new Uint8Array(N);
  for (const n of nodes) {
    const k = n.k;
    if (done[k] || !plain(k)) continue;
    // walk to the top of the run (towards children) first
    let top = k;
    while (kids[top].length === 1 && plain(kids[top][0]) && !done[kids[top][0]]) top = kids[top][0];
    const run = [];
    let x = top;
    while (x !== undefined && plain(x) && !done[x]) { run.push(x); done[x] = 1; x = nodes[x].parents[0]; }
    if (run.length < 2) continue;
    const above = kids[run[0]][0], below = nodes[run[run.length - 1]].parents[0];
    if (above === undefined || below === undefined) continue;
    // a run that was merged into another branch is folded into a ⧉ badge on the merge instead
    if (state.foldMerged && nodes[above].parents.indexOf(run[0]) > 0) continue;
    const key = nodes[run[0]].rep.id;
    if (state.elideOpen.has(key)) { res.groups.push({ key, above, below, keys: run, open: true }); continue; }
    for (const h of run) res.hidden.add(h);
    res.parents.set(above, nodes[above].parents.filter((p) => p !== run[0]));
    res.links.set(above, [below]);
    res.groups.push({ key, above, below, keys: run, open: false });
  }
  return res;
}

function decompose(model, showAbandoned) {
  const nodes = model.nodes, N = nodes.length;
  const active = new Uint8Array(N);
  nodes.forEach((n) => { active[n.k] = (!n.abandoned || showAbandoned) && !(state.elide && state.elide.hidden.has(n.k)) ? 1 : 0; });

  const gen = new Float64Array(N).fill(-1);
  for (const n of nodes) {
    if (!active[n.k] || gen[n.k] >= 0) continue;
    const stack = [n.k];
    while (stack.length) {
      const k = stack[stack.length - 1];
      if (gen[k] >= 0) { stack.pop(); continue; }
      let ready = true, g = 0;

let palette = PAL_DARK, isDark = true, bgColor = new THREE.Color('#060912');
const C = (hex) => new THREE.Color(hex);

let R = null;

/* ---------- evolog: on demand, per selection ---------- */

const lazyEvo = new Map();
function isSnapshotEntry(e) { return /^snapshot working copy/.test(e.op || ''); }
function evoAll(n) {
  if (n.abandoned) return [];
  if (n.evo.length) return n.evo;
  const l = lazyEvo.get(n.rep.id);
  return Array.isArray(l) ? l : [];
}
function evoOf(n) { const l = evoAll(n); return state.showSnaps ? l : l.filter((e) => !isSnapshotEntry(e)); }
function evoLazy() { return state.model && state.model.meta.evolog === 'lazy'; }

function evoOwners() {
  if (!R || !state.model) return [];
  if (state.evoView != null) return [state.evoView];
  if (state.evoMode === 'off') return [];
  if (state.evoMode === 'all') return state.model.nodes.filter((n) => evoOf(n).length).map((n) => n.k);
  const sel = state.selected;
  let k = -1;
  if (sel && sel.type === 'node') k = sel.k;
  else if (sel && sel.type === 'ghost') k = R.ghosts[sel.i] ? R.ghosts[sel.i].k : -1;
  return k >= 0 ? [k] : [];
}

function syncGhosts(force) {
  if (!R) return;
  const owners = evoOwners();
  const sig = owners.map((k) => k + ':' + evoOf(state.model.nodes[k]).length).join(',') + '|' + state.showSnaps;
  if (!force && sig === R.ghostSig) return;
  R.ghostSig = sig;
  if (ghostMesh) { scene.remove(ghostMesh); ghostMesh.dispose(); }
  const ghosts = [];
  for (const k of owners) evoOf(state.model.nodes[k]).forEach((e, j) => ghosts.push({ k, j, e }));
  ghostMesh = new THREE.InstancedMesh(ghostGeo, ghostMat, Math.max(ghosts.length, MAXI));
  ghostMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  ghostMesh.frustumCulled = false;
  ghostMesh.count = ghosts.length;
  scene.add(ghostMesh);
  R.ghosts = ghosts;
  R.gcur = new Float32Array(ghosts.length * 3); R.gtgt = new Float32Array(ghosts.length * 3);
  R.gsc = new Float32Array(ghosts.length); R.gtsc = new Float32Array(ghosts.length);
  ghosts.forEach((g, i) => { for (let j = 0; j < 3; j++) R.gcur[i * 3 + j] = R.cur[g.k * 3 + j]; });
  if (state.selected && state.selected.type === 'ghost' && !ghosts[state.selected.i]) state.selected = null;
  refresh(false);
}

function fetchEvolog(id) {
  lazyEvo.set(id, 'loading');
  fetch('api/evolog?id=' + encodeURIComponent(id), { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : r.text().then((t) => { throw new Error(t || 'HTTP ' + r.status); })))
    .then((d) => { lazyEvo.set(id, d.entries || []); renderInfo(); })
    .catch((e) => { lazyEvo.set(id, { error: e.message }); renderInfo(); });
}

const filesCache = new Map(), diffCache = new Map();
function fetchJSON(url, cache, key) {
  cache.set(key, 'loading');
  fetch(url, { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : r.text().then((t) => { throw new Error(t || 'HTTP ' + r.status); })))
    .then((d) => { cache.set(key, d); renderInfo(); if (!$('#opdetails').hidden) renderOpDetails(); })
    .catch((e) => { cache.set(key, { error: e.message }); renderInfo(); if (!$('#opdetails').hidden) renderOpDetails(); });
}
const STATUS_LETTER = { added: 'A', modified: 'M', removed: 'D', renamed: 'R', copied: 'C' };
function pathHtml(p) {
  const i = p.lastIndexOf('/');
  return i < 0 ? esc(p) : `<span class="dir">${esc(p.slice(0, i + 1))}</span>${esc(p.slice(i + 1))}`;
}
function fileBadges(key, path) {
  const res = key && moveCache.get(key);
  if (!res || res === 'loading' || res.error) return '';
  const f = res.files.find((x) => x.path === path);
  const mv = res.moves.filter((m) => m.from.path === path || m.to.path === path || (f && f.oldPath === m.from.path));
  let html = mv.length ? ' ' + mv.map((m) => `<span class="mvdot sm" style="background:${moveColor(m.color)}" title="move ${esc(m.from.path)} → ${esc(m.to.path)}"></span>`).join('') : '';
  if (f && f.hunks.length && f.hunks.every((h) => h.ws || h.fmt)) html += ' <small class="fmtbadge">formatting only</small>';
  return html;
}
function fileRowsHtml(files, ctx) {
  let html = '<ul class="files">';
  for (const file of files) {
    const o = state.openDiff;
    const open = o && o.id === ctx.key && o.path === file.path;
    const view = open ? o.view || 'diff' : null;
    const nums = file.added == null ? '' : `<span class="up">+${file.added}</span> <span class="down">−${file.removed}</span>`;
    const menuData = { key: ctx.key, commit: ctx.commit || '', path: file.path, status: file.status, discard: !!ctx.discard, parentOk: !!ctx.parentOk, child: ctx.child || '', take: !!ctx.take };
    html += `<li><div class="frow"><button class="file" data-file="${esc(file.path)}" data-fid="${ctx.key}" aria-expanded="${!!open}"><span class="fs fs-${esc(file.status)}">${STATUS_LETTER[file.status] || '?'}</span>`
      + `<span class="fp">${pathHtml(file.path)}${file.source ? ` <small>← ${esc(file.source)}</small>` : ''}${fileBadges(ctx.movesKey || ctx.commit, file.path)}</span><span class="fn">${nums}</span></button>`
      + `<button class="fmenu" data-fmenu='${esc(JSON.stringify(menuData))}' aria-label="File actions" title="Actions">▾</button></div>`;
    if (open) {
      const canContent = ctx.commit && file.status !== 'removed';
      html += '<div class="fviews">'
        + `<button data-fview="diff" aria-pressed="${view === 'diff'}">Diff</button>`
        + (canContent ? `<button data-fview="content" aria-pressed="${view === 'content'}">Content</button><button data-fview="blame" aria-pressed="${view === 'blame'}">Blame</button>` : '')
        + (view === 'diff' ? `<span class="fvsep"></span><button data-diffmode="unified" aria-pressed="${!state.diffSplit}">Unified</button><button data-diffmode="split" aria-pressed="${state.diffSplit}">Side by side</button>` : '')
        + '</div>';
      if (view === 'content' && canContent) html += fileContentHtml(ctx.commit, file.path);
      else if (view === 'blame' && canContent) html += blameHtml(ctx.commit, file.path);
      else if (file.diff !== undefined) html += file.diff.trim() ? `<pre class="diff">${diffHtml(file.diff, ctx.movesKey ? lineMarks(moveCache.get(ctx.movesKey), file.path) : null, file.path)}</pre>` : '<p class="hint">No text change.</p>';
      else {
        const key = ctx.key + '\u0000' + file.path;
        let d = diffCache.get(key);
        if (d === undefined) { fetchJSON(`api/diff?id=${ctx.commit}&path=${encodeURIComponent(file.path)}`, diffCache, key); d = 'loading'; }
        if (d === 'loading') html += '<p class="hint">Loading diff …</p>';
        else if (d.error) html += `<p class="hint">Unreadable: ${esc(firstLine(d.error))}</p>`;
        else if (!d.diff.trim()) html += '<p class="hint">No text change (mode only or binary).</p>';
        else html += `<pre class="diff">${diffHtml(d.diff, ctx.commit ? lineMarks(moveCache.get(ctx.commit), file.path) : null, file.path)}${d.truncated ? '<span class="dmeta">… truncated</span>' : ''}</pre>`;
      }

    html += '</li>';

  return html + '</ul>';
}

const blameCache = new Map();
const BLAME_HUES = [190, 320, 80, 40, 260, 20, 150, 210, 350, 60];
function blameHtml(id, path) {
  const key = id + '\u0000' + path;
  let d = blameCache.get(key);
  if (d === undefined) { fetchJSON(`api/annotate?id=${id}&path=${encodeURIComponent(path)}`, blameCache, key); d = 'loading'; }
  if (d === 'loading') return '<p class="hint">Running jj file annotate …</p>';
  if (d.error) return `<p class="hint">${esc(firstLine(d.error))}</p>`;
  ensureHljs();
  const m = state.model, lang = langOf(path);
  const inView = d.commits.filter((c) => m.keyOfId(c) >= 0).length;
  const bs = state.blameSel && state.blameSel.key === key ? state.blameSel : null;
  let html = `<div class="blamehead">${d.commits.length} commit${d.commits.length === 1 ? '' : 's'} wrote this file${inView < d.commits.length ? `, ${inView} of them in view` : ''}. <button class="linkbtn" data-blamehl="${encodeURIComponent(id)}/${encodeURIComponent(path)}">Highlight them in the graph</button>`
    + (SERVER ? (bs ? ` · <button class="linkbtn" data-tracebtn>Trace origin of lines ${bs.a + 1}–${bs.b + 1}</button>` : ' · <span class="hint">click line numbers (shift-click for a range) to trace where lines came from</span>') : '')
    + `</div><pre class="diff blame" data-bid="${esc(id)}" data-bpath="${esc(path)}">`;
  let prev = -1;
  d.lines.forEach((line, i) => {
    const w = d.who[i], cid = d.commits[w], c = m.commits[m.byId.get(cid)];
    const hue = BLAME_HUES[w % BLAME_HUES.length];
    const who = c ? (c.author || '').replace(/ <.*/, '') : '';
    const label = w !== prev ? (c ? `<b>${esc(who || '?')}</b> ${esc(ageText(c.ts))} <span class="bcid">${esc(c.cid.slice(0, 6))}</span> ${esc(firstLine(c.desc))}` : esc(cid.slice(0, 8))) : '';
    const title = c ? `${c.cid.slice(0, 12)} ${firstLine(c.desc)}\n${c.author || ''} ${c.ts ? fmtTime(c.ts) : ''}` : cid;
    html += `<span class="bl${w !== prev ? ' first' : ''}${bs && i >= bs.a && i <= bs.b ? ' bsel' : ''}"><button class="bg" data-bcommit="${cid}" style="--h:${hue}" title="${esc(title)}">${label || ' '}</button><i data-bline="${i}">${i + 1}</i>${hlLine(line, lang) || ' '}</span>`;
    prev = w;
  });
  return html + '</pre>';
}
function fileMenu(d, x, y) {
  const open = (view) => { state.openDiff = { id: d.key, path: d.path, view }; renderInfo(); };
  const k = (() => { const sel = state.selected; return sel && sel.type === 'node' ? sel.k : sel && sel.type === 'ghost' ? R.ghosts[sel.i].k : -1; })();
  const items = [{ label: 'Diff', run: () => open('diff') }];
  if (d.commit && d.status !== 'removed') items.push({ label: 'Content', run: () => open('content') }, { label: 'Blame', title: 'jj file annotate', run: () => open('blame') });
  if (SERVER) items.push({ label: 'Commits touching this file', run: () => highlightTouching(d.path, false) });
  if (SERVER && d.commit) items.push({ label: 'History through renames', title: 'Follows the file back and forward, also across renames with edits', run: () => followFile(d.commit, d.status === 'removed' ? d.path : d.path) });
  const cf = d.commit && conflictCache.get(d.commit);
  if (cf && cf.files && cf.files.some((f) => f.path === d.path) && canAct()) items.push({ sep: true }, { label: 'Resolve conflict …', run: () => startResolve(d.commit, d.path) });
  if (canAct() && (d.discard || d.take)) {
    items.push({ sep: true });
    if (d.discard) items.push({ label: 'Discard this change', danger: true, title: 'jj restore -c', run: () => startAction('restore', k, { into: d.commit, from: null, paths: [d.path] }) });
    if (d.discard && d.parentOk) items.push({ label: '↓ Move change to parent', title: 'jj squash', run: () => startAction('squash', k, { filesMode: 'some', paths: [d.path], intoMode: 'parent' }) });
    if (d.discard && d.child) items.push({ label: '↑ Move change to child', title: 'jj squash --into child', run: () => startAction('squash', k, { filesMode: 'some', paths: [d.path], intoMode: 'target', into: d.child, msgMode: 'dest' }) });
    if (d.take) items.push({ label: 'Take this version into current commit', title: 'jj restore --from', run: () => startAction('restore', k, { into: state.model.nodes[k].rep.id, from: d.commit, paths: [d.path] }) });
  }
  if (canAct() && d.discard && d.status !== 'removed') {
    items.push({ sep: true });
    items.push({ label: 'Make executable', title: 'jj file chmod x', run: () => quickRun({ op: 'file-chmod', mode: 'x', src: d.commit, paths: [d.path] }) });
    items.push({ label: 'Remove executable bit', title: 'jj file chmod n', run: () => quickRun({ op: 'file-chmod', mode: 'n', src: d.commit, paths: [d.path] }) });
    const kc = k >= 0 ? state.model.nodes[k].rep : null;
    if (kc && (kc.wcs || []).includes(state.model.curWs)) items.push({ label: 'Untrack (keep on disk) …', title: 'jj file untrack: only works if the path is ignored, otherwise it is tracked again at the next snapshot',
      run: () => quickRun({ op: 'file-untrack', paths: [d.path] }, `Stop tracking ${d.path}? This only sticks if the path is in .gitignore.`) });
  }
  openMenu(x, y, pathHtml(d.path), items);
}

const contentCache = new Map();
function fileContentHtml(id, path) {
  const key = id + '\u0000' + path;
  let d = contentCache.get(key);
  if (d === undefined) { fetchJSON(`api/file?id=${id}&path=${encodeURIComponent(path)}`, contentCache, key); d = 'loading'; }
  if (d === 'loading') return '<p class="hint">Loading content …</p>';
  if (d.error) return `<p class="hint">Unreadable: ${esc(firstLine(d.error))}</p>`;
  if (d.binary) return `<p class="hint">Binary file, ${d.size} bytes.</p>`;
  const lines = d.text.split('\n');
  return `<pre class="diff fcontent">${lines.slice(0, 5000).map((l, i) => `<span><i>${i + 1}</i>${esc(l) || ' '}</span>`).join('')}${d.truncated || lines.length > 5000 ? '<span class="dmeta">… truncated</span>' : ''}</pre>`;
}

function filesHtml(id, ctx = {}) {
  if (!SERVER) return '';
  let f = filesCache.get(id);
  if (f === undefined) { fetchJSON('api/files?id=' + id, filesCache, id); f = 'loading'; }
  if (f === 'loading') return '<h3>Changed files</h3><p class="hint">Loading …</p>';
  if (f.error) return `<h3>Changed files</h3><p class="hint">Unreadable: ${esc(firstLine(f.error))}</p>`;
  if (!f.files.length) return '<h3>Changed files</h3><p class="hint">No changes.</p>';
  return `<h3>Changed files, ${f.total}${f.total > f.files.length ? ` (first ${f.files.length})` : ''} <button class="linkbtn" data-opentree="${id}" title="Key T: all files at this commit">browse tree</button></h3>` + fileRowsHtml(f.files, { key: id, commit: id, ...ctx });
}

const pairCache = new Map();
function pairFilesHtml(kind, from, to) {
  if (!SERVER) return '';
  const key = kind + ':' + from + ':' + to;
  let f = pairCache.get(key);
  if (f === undefined) { fetchJSON(`api/pair?kind=${kind}&from=${from}&to=${to}`, pairCache, key); f = 'loading'; }
  const title = kind === 'diff' ? 'Content diff' : 'Interdiff (difference of the changes)';
  if (f === 'loading') return `<h3>${title}</h3><p class="hint">Loading …</p>`;
  if (f.error) return `<h3>${title}</h3><p class="hint">Unreadable: ${esc(firstLine(f.error))}</p>`;
  if (!f.files.length) return `<h3>${title}</h3><p class="hint">No differences.</p>`;
  return `<h3>${title}, ${f.total} file${f.total === 1 ? '' : 's'}${f.truncated ? ' (truncated)' : ''}</h3>` + fileRowsHtml(f.files, { key, movesKey: kind === 'diff' ? 'pair:' + from + ':' + to : null });
}

function evoHtml(n) {
  if (n.abandoned) return '';
  let all = n.evo.length ? n.evo : lazyEvo.get(n.rep.id);
  if (all === undefined && evoLazy()) {
    if (SERVER) { fetchEvolog(n.rep.id); all = 'loading'; } else return '';
  }
  if (all === 'loading') return '<h3>Evolog</h3><p class="hint">Loading …</p>';
  if (all && all.error) return `<h3>Evolog</h3><p class="hint">Unreadable: ${esc(firstLine(all.error))}</p>`;
  if (!Array.isArray(all) || !all.length) return evoLazy() ? '<h3>Evolog</h3><p class="hint">No earlier versions.</p>' : '';
  const snaps = all.filter(isSnapshotEntry).length;
  const list = state.showSnaps ? all : all.filter((e) => !isSnapshotEntry(e));
  let html = `<h3>Evolog, ${list.length} earlier version${list.length === 1 ? '' : 's'}`;
  if (snaps) html += ` <button class="linkbtn" data-snaps>${state.showSnaps ? 'hide snapshots' : 'show ' + snaps + ' snapshot' + (snaps === 1 ? '' : 's')}</button>`;
  if (SERVER || list.length) html += ` <button class="linkbtn" data-evoview="${n.k}" title="Key V: tilt into a timeline, newest on top">${state.evoView === n.k ? 'close timeline' : 'timeline'}</button>`;
  html += '</h3><ul class="evo">';
  for (const e of list) html += `<li>${idHtml(e.id, e.ip, 'cpfx', 8)}<span>${hl(e.desc || '(no description)')}<span class="op">${hl(firstLine(e.op || ''))}</span></span></li>`;
  return html + '</ul>';
}

function rebuildMeshes() {
  for (const m of [nodeMesh, conflictMesh, emptyMesh, ghostMesh]) if (m) { scene.remove(m); m.dispose(); }
  if (R) {
    for (const l of R.labels) scene.remove(l.obj);
    for (const l of R.idLabels || []) scene.remove(l.obj);
    // every label set goes with the old graph; left in the scene they would keep showing the previous state
    for (const set of [R.elideLabels, R.idleLabels, R.evoLabels, R.rowLabels && [...R.rowLabels.values()]]) for (const l of set || []) { scene.remove(l.obj); if (l.obj.element) l.obj.element.remove(); }
    for (const w of R.ws || []) { scene.remove(w.ring, w.obj); w.ring.material.dispose(); }
  }
  const nodes = state.model.nodes;
  const nConf = nodes.filter((n) => n.rep.conflict).length;
  const nEmpty = nodes.filter(isHollow).length;
  const nNorm = nodes.length - nConf - nEmpty;
  const ghosts = [];
  nodeMesh = new THREE.InstancedMesh(nodeGeo, new THREE.MeshBasicMaterial(), Math.max(nNorm, MAXI));
  conflictMesh = new THREE.InstancedMesh(conflictGeo, new THREE.MeshBasicMaterial(), Math.max(nConf, MAXI));
  emptyMesh = new THREE.InstancedMesh(nodeGeo, new THREE.MeshBasicMaterial({ wireframe: true }), Math.max(nEmpty, MAXI));
  ghostMesh = new THREE.InstancedMesh(ghostGeo, ghostMat, MAXI);
  for (const m of [nodeMesh, conflictMesh, emptyMesh, ghostMesh]) { m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.frustumCulled = false; m.count = 0; scene.add(m); }
  const slot = new Int32Array(nodes.length);
  const keyAt = new Map([[nodeMesh, []], [conflictMesh, []], [emptyMesh, []]]);
  nodes.forEach((n) => { const list = keyAt.get(meshOf(n)); slot[n.k] = list.length; list.push(n.k); });
  nodeMesh.count = nNorm; conflictMesh.count = nConf; emptyMesh.count = nEmpty; ghostMesh.count = ghosts.length;
  const N = nodes.length;
  R = {
    slot, ghosts, keyAt,
    cur: new Float32Array(N * 3), tgt: new Float32Array(N * 3),
    sc: new Float32Array(N), tsc: new Float32Array(N),
    gcur: new Float32Array(ghosts.length * 3), gtgt: new Float32Array(ghosts.length * 3),
    gsc: new Float32Array(ghosts.length), gtsc: new Float32Array(ghosts.length),
    radial: new Float32Array(N * 2), edges: [], first: true, labels: [], bml: new Map(), prevLabelPos: null,
    conflicts: nodes.filter((n) => n.rep.conflict).map((n) => n.k), ghostSig: null,
  };
  for (const o of labelsEl.querySelectorAll('.lblwrap')) o.remove();
  for (const w of R.ws || []) { scene.remove(w.ring, w.obj); }
  R.ws = state.model.wsNames.map((name, i) => {
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true }));
    const el = document.createElement('div');
    el.className = 'lblwrap';
    const inner = document.createElement('span');
    inner.className = 'lbl ws' + (name === state.model.curWs ? ' cur' : '');
    inner.dataset.ws = name;
    if ((state.model.workspaces.find((w) => w.name === name) || {}).stale) inner.classList.add('stale');
    inner.textContent = name === state.model.curWs ? '@ ' + name : name + '@';
    el.appendChild(inner);
    const obj = new THREE.CSS2DObject(el);
    scene.add(ring, obj);
    return { name, idx: i, ring, obj, inner, k: -1 };
  });
  colorWorkspaces();
  buildIdLabels();
}

/* flat (2D) view: a text column next to the graph, one line per commit */
function ageText(ts) {
  const d = (Date.now() - Date.parse(ts)) / 1000;
  if (!isFinite(d)) return '';
  if (d < 90) return 'now';
  if (d < 5400) return Math.round(d / 60) + 'm';
  if (d < 129600) return Math.round(d / 3600) + 'h';
  if (d < 86400 * 60) return Math.round(d / 86400) + 'd';
  if (d < 86400 * 700) return Math.round(d / 86400 / 30) + 'mo';
  return Math.round(d / 86400 / 365) + 'y';
}
function syncRowLabels() {
  const flat = R && state.layout === 'flat' && !R.atOp;
  const want = flat ? new Set(state.evoView != null ? [state.evoView] : R.flatRows || []) : new Set();
  syncEvoLabels();
  R.rowLabels = R.rowLabels || new Map();

function updateLabels() {

  for (const [name, keys] of at) {

const projV = new THREE.Vector3();
let occFrame = 0;
function occludeLabels(moving) {
  if (!R || state.bmMode === 'off' || (occFrame++ % (moving ? 4 : 2))) return;
  const nodes = state.model.nodes, N = nodes.length;
  const W = stage.clientWidth, H = stage.clientHeight;
  const focal = H / (2 * Math.tan(camera.fov * Math.PI / 360));
  if (!R.proj || R.proj.length < N * 4) R.proj = new Float32Array(N * 4);
  const P = R.proj;
  for (let k = 0; k < N; k++) {
    const s = R.sc[k];
    if (s < 0.3) { P[k * 4 + 3] = 0; continue; }
    projV.set(R.cur[k * 3], R.cur[k * 3 + 1], R.cur[k * 3 + 2]);
    const d = projV.distanceTo(camera.position);
    projV.project(camera);
    P[k * 4] = (projV.x * 0.5 + 0.5) * W;
    P[k * 4 + 1] = (-projV.y * 0.5 + 0.5) * H;
    P[k * 4 + 2] = d;
    P[k * 4 + 3] = projV.z < 1 ? Math.max(3, 0.24 * s * focal / d) : 0;
  }
  const hot = hoverHit && hoverHit.type === 'node' ? hoverHit.k : (state.selected && state.selected.type === 'node' ? state.selected.k : -1);
  for (const l of R.labels) {
    if (!l.obj.visible || !l.cur) continue;
    if (!l.w) { l.w = l.inner.offsetWidth; l.h = l.inner.offsetHeight; }
    projV.copy(l.cur);
    const d0 = projV.distanceTo(camera.position);
    projV.project(camera);
    const x0 = (projV.x * 0.5 + 0.5) * W + 14, yc = (-projV.y * 0.5 + 0.5) * H + (parseFloat(l.inner.style.top) || 0);
    const x1 = x0 + l.w, y0 = yc - l.h / 2, y1 = yc + l.h / 2;
    let occ = false;
    const pin = l.k === state.model.trunk || (state.model.nodes[l.k] && state.model.nodes[l.k].rep.wc);
    if (pin !== !!l.pin) { l.pin = pin; l.obj.pinned = pin; l.inner.classList.toggle('pin', pin); }
    if (l.k !== hot && !pin) {
      for (let k = 0; k < N && !occ; k++) {
        const r = P[k * 4 + 3];

function pulse(now) {

let camTween = null;
function fit(instant) {

/* ---------- compare ---------- */

function ancestors(keys) {
  const nodes = state.model.nodes, seen = new Set(), st = [...keys];
  while (st.length) {
    const k = st.pop();
    if (seen.has(k)) continue;
    seen.add(k);
    for (const p of parentsOf(k)) st.push(p);
    for (const p of nodes[k].elided) st.push(p);
  }
  return seen;
}

function short(id) { return id.slice(0, 12); }

function resolveCompare(spec) {
  const m = state.model;
  const keys = (ids) => uniq(ids.map((id) => m.keyOfId(id)).filter((k) => k >= 0));
  const wsTarget = (name) => {
    const w = m.workspaces.find((x) => x.name === name);
    if (w) return [w.target];
    const c = m.commits.find((x) => !x.gone && (x.wcs || []).includes(name));
    return c ? [c.id] : [];
  };
  let A, B;
  if (spec.kind === 'remote') {
    const l = m.bmState.get(spec.name), r = m.bmState.get(spec.name + '@' + spec.remote);
    if (!l || !r) return null;
    A = { label: spec.name, ids: l.targets, rev: spec.name };
    B = { label: spec.name + '@' + spec.remote, ids: r.targets, rev: spec.name + '@' + spec.remote };
  } else if (spec.kind === 'conflict') {
    const l = m.bmState.get(spec.name);
    if (!l || l.targets.length < 2) return null;
    A = { label: spec.name + ' (1)', ids: [l.targets[0]], rev: short(l.targets[0]) };
    B = { label: spec.name + ' (2)', ids: [l.targets[1]], rev: short(l.targets[1]) };
  } else if (spec.kind === 'ws') {
    A = { label: '@ (' + m.curWs + ')', ids: wsTarget(m.curWs), rev: '@' };
    B = { label: spec.name + '@', ids: wsTarget(spec.name), rev: spec.name + '@' };
  } else {
    const ca = m.commits[m.byId.get(spec.a)], cb = m.commits[m.byId.get(spec.b)];
    const same = ca && cb && ca.cid === cb.cid;
    const lbl = (c, id) => !c ? short(id) : !same ? c.cid.slice(0, 12) : c.divergent && c.co != null ? c.cid.slice(0, 12) + '/' + c.co : short(id);
    A = { label: lbl(ca, spec.a), ids: [spec.a], rev: short(spec.a) };
    B = { label: lbl(cb, spec.b), ids: [spec.b], rev: short(spec.b) };
  }
  A.keys = keys(A.ids); B.keys = keys(B.ids);
  if (!A.keys.length || !B.keys.length) return null;
  const ancA = ancestors(A.keys), ancB = ancestors(B.keys);
  const both = new Set([...ancA].filter((k) => ancB.has(k)));
  const notHead = new Set();
  for (const k of both) for (const p of parentsOf(k).concat(m.nodes[k].elided)) if (both.has(p)) notHead.add(p);
  const fork = new Set([...both].filter((k) => !notHead.has(k)));
  const onlyA = new Set([...ancA].filter((k) => !ancB.has(k)));
  const onlyB = new Set([...ancB].filter((k) => !ancA.has(k)));
  return { spec, A, B, onlyA, onlyB, fork };
}

function setCompare(spec) {
  state.compareSpec = spec;

  if (spec && !state.compare) state.compareSpec = null;
  state.pickA = -1;

    let changed = false;

      const bi = state.deco.branchOf[k];

}

  let extraA = '', extraB = '';

  else if (k === 'a') $('#t-ab').click();
  else if (k === 'i') $('#t-ids').click();
  else if (k === 'b') $('#t-bm').click();

    if (e.key === 'ArrowDown') next = parentsOf(kk).find((p) => R.tsc[p] > 0) ?? -1;

/* ---------- loading ---------- */

function validate(raw) {
  if (!raw || !Array.isArray(raw.commits)) throw new Error('Not a jj-orbit export: the “commits” field is missing.');
  if (!raw.commits.length) throw new Error('The export contains no commits. Check the revset (-r).');
  return decodeOps(raw);
}

function capture() {
  const pos = new Map(), posC = new Map();
  for (const n of state.model.nodes) {
    const k = n.k, v = [R.cur[k * 3], R.cur[k * 3 + 1], R.cur[k * 3 + 2], R.sc[k]];
    pos.set(n.rep.id, v);
    if (!posC.has(n.rep.cid)) posC.set(n.rep.cid, v);
  }
  const ops = state.model.ops;
  const sel = state.selected && state.selected.type === 'node' ? state.model.nodes[state.selected.k].rep.cid : null;
  const labels = new Map();
  for (const [key, l] of R.bml) if (l.cur && l.assigned) labels.set(key, [l.cur.x, l.cur.y, l.cur.z]);
  return { pos, posC, sel, labels, live: !ops.length || state.op >= ops.length - 1, opId: ops[state.op]?.id };
}

function load(raw, isDemo, keep) {
  stopPlay();
  const prev = keep && R && state.model ? capture() : null;
  state.raw = raw; state.isDemo = isDemo;
  state.model = buildModel(raw);
  state.sim = null;
  if (state.act && !state.exact) { const sim = simulate(state.act); state.sim = sim && sim.ok ? sim : null; }
  renderEvoButton();
  $('#revsetbox').hidden = !SERVER;
  $('#t-moves').hidden = !SERVER;
  $('#op-undo').hidden = $('#op-redo').hidden = !SERVER || live.actions === false;
  renderMoreOps();
  renderWindowCtl();
  if (SERVER) maybeAutoStale();
  renderUntracked();
  applyRevsetIds();
  state.hoverBranch = -1; state.pickA = -1;
  if (!prev) { restoreView(); state.compareSpec = null; }
  state.deco = buildDeco();
  rebuildMeshes();
  R.prevLabelPos = prev ? prev.labels : null;
  const ops = state.model.ops;
  $('#opbar').classList.toggle('on', ops.length > 1);
  opInput.max = Math.max(0, ops.length - 1);
  state.op = ops.length ? ops.length - 1 : -1;
  if (prev && !prev.live) { const i = ops.findIndex((o) => o.id === prev.opId); if (i >= 0) state.op = i; }
  opInput.value = Math.max(0, state.op);
  const meta = state.model.meta;
  const nCur = state.model.nodes.filter((n) => !n.abandoned).length;
  $('#meta').innerHTML = (isDemo ? '<span class="demo">Demo repo pulse-compiler</span><br>' : '') +
    `${meta.repo && meta.repo !== '.' ? esc(meta.repo) + '<br>' : ''}${nCur} commits, ${ops.length} ops<br>${meta.generated ? 'exported ' + fmtTime(meta.generated) : ''}`;
  $('#meta').title = meta.revset || '';
  const warns = meta.warnings || [];
  if (meta.stale) $('#meta').insertAdjacentHTML('beforeend', `<div class="stalebar">Working copy is stale${SERVER && live.actions !== false ? ' <button class="linkbtn" data-updstale title="jj workspace update-stale">Update</button>' : ''}</div>`);
  if (warns.length) {
    $('#meta').insertAdjacentHTML('beforeend', `<details class="warns"><summary>${warns.length} export warning${warns.length === 1 ? '' : 's'}</summary><ul>${warns.map((w) => `<li>${hl(w)}</li>`).join('')}</ul></details>`);
  }

}

function renderSnap() {

function loadText(text, isDemo, persist = !isDemo) {
  $('#err').textContent = '';
  try {
    let parsed = JSON.parse(text);
    if (parsed && parsed.kind === 'jj-orbit-state' && parsed.graph) {
      // an exported viewer state: load its graph, then restore the view it was taken in
      const v = parsed.view || {};

      setTimeout(() => applyStateView(v), 0);
    }
    if (isDemo && parsed && Array.isArray(parsed.snapshots)) {
      state.snaps = parsed.snapshots.map(validate);
      state.snapIdx = state.snaps.length - 1;
      load(state.snaps[state.snapIdx], true, false);
      return true;
    }
    const raw = validate(parsed);
    const m = state.model;
    const same = m && !state.isDemo && raw.meta && m.meta.repo === raw.meta.repo && m.meta.revset === raw.meta.revset;
    load(raw, isDemo, same);
    if (persist) { try { localStorage.setItem(STORE_KEY, text); } catch { /* too large or unavailable */ } }
    return true;
  } catch (err) {
    $('#err').textContent = err.message.startsWith('Not a') || err.message.startsWith('The export') ? err.message : 'Could not read the file: ' + err.message;

}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  composer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.12, (now - last) / 1000); last = now;
  if (camTween) {
    const t = Math.min(1, (now - camTween.s) / 650), e = 1 - Math.pow(1 - t, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (t >= 1) camTween = null;
  }
  updateEvoTilt(dt);
  if (Math.abs(camera.fov - fovTarget) > 0.02) {
    // Keep the framing while the field of view changes: move along the view axis so the target plane keeps its size.
    const d0 = camera.position.distanceTo(controls.target);
    const f0 = camera.fov;
    camera.fov = reduceMotion ? fovTarget : f0 + (fovTarget - f0) * Math.min(1, dt * 6);
    const k = Math.tan(f0 * Math.PI / 360) / Math.tan(camera.fov * Math.PI / 360);
    if (!camTween) camera.position.sub(controls.target).setLength(d0 * k).add(controls.target);
    camera.updateProjectionMatrix();
  }
  const camMoved = controls.update();
  if (scene.fog) {
    const d = camera.position.distanceTo(controls.target);
    const span = Math.max(R && R.radius ? R.radius : 10, 5);
    scene.fog.near = Math.max(0.1, d - span * 0.2);
    scene.fog.far = d + span * 3.5;
    const far = Math.max(2000, (d + span * 4) * 1.5);
    if (Math.abs(camera.far - far) > 1) { camera.far = far; camera.updateProjectionMatrix(); }
  }
  let moving = !!camTween || camMoved || Math.abs(camera.fov - fovTarget) > 0.02 || Math.abs(evoAngle - (state.evoView != null ? Math.PI / 2 : 0)) > 1e-3;
  const anim = R && (R.conflicts.length || state.selected || state.pickA >= 0 || state.multi.length) && !reduceMotion;
  if (R) moving = step(dt) || moving;
  const due = moving || now < renderUntil || (anim && now - lastRender > 66);
  if (!due) { if (R && pendingPick) { hoverHit = pick(pendingPick.x, pendingPick.y); showTip(hoverHit, pendingPick.x, pendingPick.y); pendingPick = null; } requestAnimationFrame(frame); return; }
  adaptResolution(now, moving);
  lastRender = now;
  if (R) {

    const lf = reduceMotion ? 1 : 1 - Math.exp(-dt * 7);
    for (const l of R.labels) {
      if (!l.obj.visible) continue;
      tmpV.set(R.cur[l.k * 3], R.cur[l.k * 3 + 1], R.cur[l.k * 3 + 2]);
      if (!l.cur) l.cur = tmpV.clone();

    }
    for (const l of R.idLabels) if (l.obj.visible) l.obj.position.set(R.cur[l.k * 3], R.cur[l.k * 3 + 1], R.cur[l.k * 3 + 2]);
    updateRowLabels();
    occludeLabels(moving);
    updateConstellation(dt);
    updateMoreLabel(dt);
    updateIdleLabels();
    for (const w of R.ws) {
      const vis = w.k >= 0 && R.sc[w.k] > 0.3;
      w.ring.visible = vis; w.obj.visible = vis;
      if (!vis) continue;
      w.ring.position.set(R.cur[w.k * 3], R.cur[w.k * 3 + 1], R.cur[w.k * 3 + 2]);
      w.ring.quaternion.copy(camera.quaternion);
      w.ring.scale.setScalar(1 + w.level * 0.32);
      w.obj.position.copy(w.ring.position);
      w.inner.style.top = (-16 - w.level * 15) + 'px';
    }
    const sel = state.selected;
    let sp = null;
    if (!sel && state.pickA >= 0 && R.sc[state.pickA] > 0.05) sp = [R.cur[state.pickA * 3], R.cur[state.pickA * 3 + 1], R.cur[state.pickA * 3 + 2]];
    if (sel && sel.type === 'node' && R.sc[sel.k] > 0.05) sp = [R.cur[sel.k * 3], R.cur[sel.k * 3 + 1], R.cur[sel.k * 3 + 2]];
    if (sel && sel.type === 'ghost' && R.gsc[sel.i] > 0.05) sp = [R.gcur[sel.i * 3], R.gcur[sel.i * 3 + 1], R.gcur[sel.i * 3 + 2]];

}

/* ---------- revset ---------- */

state.revsetHits = null;
state.revsetQuery = '';
let revsetIds = null;

  state.revsetHits = new Set(revsetIds.map((id) => m.keyOfId(id)).filter((k) => k >= 0));
}
async function runRevset(q) {

  msg.textContent = 'running …'; msg.classList.remove('bad');

    const d = await r.json();
    if (!d.ok) { msg.textContent = d.error || 'invalid revset'; msg.classList.add('bad'); return; }
    revsetIds = d.ids;
    applyRevsetIds();

const conflictCache = new Map();
function conflictsHtml(c) {

  if (d === undefined) { fetchJSON('api/conflicts?id=' + c.id, conflictCache, c.id); d = 'loading'; }
  if (d === 'loading') return '<h3>Conflicts</h3><p class="hint">Loading …</p>';
  if (d.error) return `<h3>Conflicts</h3><p class="hint">${esc(firstLine(d.error))}</p>`;
  const isWc = (c.wcs || []).includes(state.model.curWs) || c.wc;
  let html = `<h3>Conflicts in ${d.files.length} file${d.files.length === 1 ? '' : 's'}</h3><ul class="files">`;
  for (const f of d.files) {
    const link = isWc ? ` <a class="linkbtn" href="vscode://file/${encodeURI((d.root + '/' + f.path).replace(/\/\//g, '/'))}" title="Open the working-copy file with its conflict markers">open in editor</a>` : '';
    const res = canAct() && /2-sided/.test(f.kind) ? ` <button class="linkbtn" data-resolvefile="${esc(f.path)}" data-rid="${c.id}" title="Pick sides per conflict, in the viewer">resolve</button>` : '';
    html += `<li><div class="frow"><span class="fs fs-removed">!</span> <span class="fp">${pathHtml(f.path)} <small>${esc(f.kind)}</small></span>${res}${link}</div></li>`;
  }

  return html;
}

/* ---------- line selection (split, squash, restore) ---------- */

const hunksCache = new Map();
function lineSel(a, path) {
  if (!a.lines[path]) a.lines[path] = { whole: false, keep: new Set() };
  return a.lines[path];
}
function selectionRequest(a) {
  const h = hunksCache.get(a.lineSrc);
  if (!h || !h.files) return null;
  const files = {};
  for (const f of h.files) {
    const s = a.lines[f.path];
    if (!s || (!s.whole && !s.keep.size)) continue;
    files[f.path] = { sha_a: f.sha_a, sha_b: f.sha_b, whole: s.whole, keep: [...s.keep].map((x) => { const [i, side, off] = x.split(':'); return [+i, side, +off]; }) };

/* ---------- divergent versions: where each one lives, and keeping one ---------- */

// Remote bookmarks at this commit or at a descendant: shows which version of a divergent change the remote has.
function openBmManager() {
  if (!SERVER || live.actions === false) return;
  state.act = null; state.bmManager = true; state.bmSel = new Set(); mergedBookmarks = null; renderInfo();
}
function remoteVia(k) {
  const m = state.model;
  if (!m._kids) {
    m._kids = Array.from({ length: m.nodes.length }, () => []);
    for (const n of m.nodes) if (!n.abandoned) for (const p of n.parents) m._kids[p].push(n.k);
    m._via = new Map();
  }
  if (m._via.has(k)) return m._via.get(k);
  const seen = new Set([k]), q = [k];
  let res = null;
  while (q.length && !res) {
    const x = q.shift();
    const rb = m.nodes[x].rep.rb || [];
    if (rb.length) res = { direct: x === k, names: rb };
    else for (const c of m._kids[x]) if (!seen.has(c)) { seen.add(c); q.push(c); }
  }
  m._via.set(k, res);
  return res;
}
function keepVersionPlan(k) {
  const m = state.model;
  const group = m.divGroups.find((g) => g.includes(k)) || [];
  const keep = m.nodes[k].rep;
  const drop = group.filter((x) => x !== k && !m.nodes[x].abandoned);
  const dropIds = new Set(drop.map((x) => m.nodes[x].rep.id));
  const kids = [];
  for (const n of m.nodes) {
    if (n.abandoned || dropIds.has(n.rep.id) || n.k === k) continue;
    if (n.parents.some((p) => dropIds.has(m.nodes[p].rep.id))) kids.push(n.rep.id);
  }
  const blocked = drop.filter((x) => m.nodes[x].rep.immutable);
  const sh = (id) => id.slice(0, 12);
  const cmds = [];
  if (kids.length) cmds.push(`jj rebase -s ${kids.map(sh).join(' -s ')} -o ${sh(keep.id)}`);
  cmds.push(`jj abandon ${drop.map((x) => sh(m.nodes[x].rep.id)).join(' ')}`);
